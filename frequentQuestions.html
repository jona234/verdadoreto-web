    {"title": "3. Retos privados", "cards": [{"type": "dare", "heading": "¿Qué es un reto privado?", "body": "Puedes retar en privado a un usuario que sigas. La foto o el vídeo de respuesta solo la veis vosotros dos, a menos que ambos decidáis publicarla en el feed."}, {"type": "", "heading": "Cómo enviar un reto privado", "steps": ["Ve al perfil de un usuario que sigas.", "Pulsa <strong>Retar en privado</strong> y escribe o elige el reto.", "Envíalo. El envío tiene un pequeño coste en monedas."]}, {"type": "", "heading": "Cómo responder", "steps": ["Abre el reto privado desde tus notificaciones o desde el menú <strong>Retos privados</strong>.", "Pulsa <strong>Responder</strong> y sube tu foto o vídeo.", "Vota si quieres publicar la respuesta en el feed público."]}, {"type": "warning", "heading": "Caducidad y reembolso", "body": "Si nadie responde, el reto caduca a los <strong>5 días</strong> y se reembolsan automáticamente las monedas a quien lo envió. También puedes cancelarlo tú mismo mientras no se haya respondido."}, {"type": "", "heading": "¿Cuándo se publica en el feed?", "body": "Solo si <strong>tanto tú como la otra persona</strong> votáis a favor de publicarlo. Si alguno de los dos prefiere que quede privado, nunca se hace público."}, {"type": "", "heading": "Reportar un reto privado", "body": "Puedes reportarlo igual que cualquier otra publicación, pulsando el icono 🚩. Lo revisará nuestro equipo de moderación."}]},

    {"title": "9. Premium y ruleta diaria", "cards": [{"type": "info", "heading": "¿Qué es Premium?", "body": "Una suscripción mensual. Mientras la tengas, cada día, en vez de recibir tu reto diario sin más, <strong>giras una ruleta</strong> que decide qué te toca. El precio lo pone la tienda de tu país y lo ves antes de pagar."}, {"type": "", "heading": "Los cuatro premios", "body": "La ruleta tiene cuatro casillas:", "list": ["<strong>Reto diario:</strong> lo de siempre.", "<strong>Recompensa x2:</strong> ese reto o verdad da el doble de monedas y de EXP.", "<strong>Tú eliges:</strong> decides si prefieres un reto o una verdad.", "<strong>Dos en uno:</strong> recibes un reto y una verdad el mismo día."], "bodyAfter": "Es al azar, así que unos días toca mejor que otros."}, {"type": "warning", "heading": "Cómo saber cuál da el doble", "body": "El reto o la verdad con recompensa doble lleva un distintivo naranja con un rayo y <strong>x2</strong> en tu lista de retos. Al completarlo cobras el doble sin hacer nada más."}, {"type": "", "heading": "Una tirada al día", "body": "Solo se puede girar una vez al día. Si cierras la ruleta sin girar no pierdes nada: la tirada te sigue esperando y vuelves a ella desde el menú lateral → <strong>Ruleta diaria</strong>, que mientras tanto te avisa con un globito."}, {"type": "", "heading": "Cómo suscribirse", "steps": ["Menú <strong>Tienda</strong> → pestaña <strong>PREMIUM</strong>.", "Pulsa <strong>Suscribirme</strong> y confirma el pago en tu tienda.", "Al terminar, si hoy te queda tirada, la ruleta se abre sola."]}, {"type": "", "heading": "Cómo cancelar", "body": "Se cancela desde tu tienda: <strong>Google Play → Suscripciones</strong> o <strong>Ajustes → tu Apple ID → Suscripciones</strong>. En la pestaña PREMIUM tienes un acceso directo. Sigues siendo Premium hasta que acabe el periodo que ya has pagado."}, {"type": "info", "heading": "Cambio de móvil o reinstalación", "body": "Pulsa <strong>Restaurar compra</strong> en la pestaña PREMIUM. Recupera una suscripción que ya hayas pagado con esa misma cuenta de Google Play o de la App Store. Si no encuentra ninguna compra, te lo dice."}, {"type": "", "heading": "La corona 👑", "body": "Mientras seas Premium sale una corona al lado de tu nombre en el menú lateral."}]},

    {"title": "12. Tu perfil", "cards": [{"type": "", "heading": "Editar perfil", "body": "Menú lateral → <strong>Perfil</strong> → icono ✏️. Cambia nick, nombre y foto."}, {"type": "", "heading": "Rangos y EXP", "body": "Completa retos y verdades para ganar EXP y subir de rango. Hay 10 rangos en total.", "ranges": true}]},

    {"title": "14. Reportar contenido", "cards": [{"type": "", "heading": "¿Cómo reporto?", "body": "Pulsa el icono 🚩 junto al botón de compartir (o dentro de un reto privado), selecciona el motivo y pulsa <strong>Enviar reporte</strong>."}, {"type": "", "heading": "Motivos disponibles", "list": ["🔞 Contenido sexual", "👊 Violencia", "📢 Spam", "🗣️ Discurso de odio", "❌ Información falsa", "💬 Otro motivo"]}, {"type": "info", "heading": "¿Qué pasa después?", "body": "Tu reporte llega al equipo de moderación. Solo puedes reportar cada publicación (o reto privado) una vez."}, {"type": "info", "heading": "Mis reportes", "body": "Puedes ver el estado de tus reportes en el menú lateral → <strong>Mis reportes</strong>: <strong>En curso</strong>, <strong>Aceptado</strong> o <strong>Rechazado</strong>. Si el equipo te responde, verás su respuesta ahí."}, {"type": "", "heading": "Cancelar un reporte", "body": "Mientras un reporte esté <strong>En curso</strong>, puedes cancelarlo desde <strong>Mis reportes</strong>."}, {"type": "", "heading": "Reportar un comentario", "body": "En los comentarios de una publicación también puedes pulsar 🚩 para reportar. El equipo lo revisa y, si lo retira, avisa a quien lo escribió con el motivo."}, {"type": "warning", "heading": "¿Qué es un Strike?", "body": "Si incumples las normas, el equipo puede sancionar tu cuenta. Cada sanción suma un <strong>strike</strong> (lo verás junto a tu nombre). Al acumular <strong>3 strikes</strong>, la cuenta se suspende de forma permanente."}]},

    {"title": "16. Preguntas frecuentes", "cards": [{"type": "", "heading": "¿Por qué no puedo iniciar sesión?", "body": "Verifica tu email. Si no lo has hecho, te reenviaremos el enlace automáticamente."}, {"type": "", "heading": "¿No me llega el email de verificación?", "body": "Revisa spam. Si sigue sin llegar, intenta iniciar sesión para reenviarlo. También: <a href='mailto:devlicius.online@gmail.com'>devlicius.online@gmail.com</a>."}, {"type": "", "heading": "¿Las publicaciones caducan?", "body": "Sí, a los <strong>7 días</strong>."}, {"type": "", "heading": "¿Y los retos privados sin responder?", "body": "Caducan a los <strong>5 días</strong> y se reembolsan las monedas a quien retó."}, {"type": "", "heading": "¿Puedo eliminar mi cuenta?", "body": "Sí. Menú lateral → <strong>Configuración → Borrar cuenta</strong>. Acción irreversible."}, {"type": "", "heading": "¿Mis datos están seguros?", "body": "Sí. Consulta nuestra <a href='privacyPolicy.html'>Política de Privacidad</a>."}, {"type": "warning", "heading": "¿Cómo recibo un premio?", "body": "Nos pondremos en contacto contigo o enviaremos el premio al correo con el que te registraste. <strong>Es imprescindible que tengas acceso a dicho correo</strong>, ya que es el único medio que utilizaremos para contactarte."}]}

"en": {

    {"title": "1. Registration & Account", "cards": [{"type": "info", "heading": "How to create an account", "steps": ["Open the app and tap <strong>Sign up</strong>.", "Fill in your nick, name, email and password.", "Accept the privacy policy and tap <strong>Register</strong>.", "Check your email and confirm your account."]}, {"type": "info", "heading": "I forgot my password", "steps": ["On the login screen tap <strong>Forgot your password? Recover it</strong>.", "Enter your email and tap <strong>Send code</strong>.", "Check your email, copy the code and enter it with your new password."]}, {"type": "info", "heading": "Change password (with active session)", "body": "Open side menu → <strong>Settings → Change password</strong>."}]},
    {"title": "2. Challenges & Truths", "cards": [{"type": "dare", "badge": "dare", "badgeText": "DARE", "heading": "What is a dare?", "body": "A dare is a challenge you must complete by recording a video as proof."}, {"type": "truth", "badge": "truth", "badgeText": "TRUTH", "heading": "What is a truth?", "body": "A truth is a question you must answer with <strong>True</strong> or <strong>False</strong>."}, {"type": "", "heading": "Locked challenges & truths 🔒", "body": "They appear with a padlock. Tap to see details and tap <strong>Accept challenge!</strong> to unlock."}, {"type": "", "heading": "How to complete a dare", "steps": ["Go to <strong>Challenges</strong> menu → <strong>Pending</strong> tab.", "Tap the locked dare to open it.", "Tap <strong>Do it</strong> and select a video (max 1 minute).", "Tap <strong>Complete</strong>."]}, {"type": "", "heading": "How to complete a truth", "steps": ["Go to <strong>Challenges</strong> menu → <strong>Pending</strong> tab.", "Tap the locked truth to open it.", "Read the question and select <strong>TRUE</strong> or <strong>FALSE</strong>.", "Tap <strong>Complete</strong>."]}, {"type": "", "heading": "Transfer a challenge or truth", "body": "Tap <strong>Transfer</strong>, choose a user you follow and confirm."}, {"type": "warning", "badge": "daily", "badgeText": "DAILY", "heading": "Daily challenge / truth", "body": "Every day you receive a special one marked <strong>DAILY</strong>. The title is hidden until you open it."}, {"type": "dare", "heading": "Seasonal challenges 🎃", "body": "From time to time, the Verdad o Reto team sends a <strong>special seasonal challenge</strong> (for example, at Halloween or Christmas). It appears directly in your challenges, open and ready to do, and you get a notification about it. You complete it just like any other challenge."}]},
    {"title": "3. Private Challenges", "cards": [{"type": "dare", "heading": "What is a private challenge?", "body": "You can privately challenge a user you follow. The response photo or video is only seen by the two of you, unless you both choose to publish it to the feed."}, {"type": "", "heading": "How to send a private challenge", "steps": ["Go to the profile of a user you follow.", "Tap <strong>Challenge privately</strong> and write or pick the challenge.", "Send it. Sending has a small coin cost."]}, {"type": "", "heading": "How to respond", "steps": ["Open the private challenge from your notifications or the <strong>Private Challenges</strong> menu.", "Tap <strong>Respond</strong> and upload your photo or video.", "Vote whether you want the response published to the public feed."]}, {"type": "warning", "heading": "Expiry & refund", "body": "If nobody responds, the challenge expires after <strong>5 days</strong> and the coins are automatically refunded to whoever sent it. You can also cancel it yourself while it's unanswered."}, {"type": "", "heading": "When does it get published to the feed?", "body": "Only if <strong>both you and the other person</strong> vote to publish it. If either of you prefers to keep it private, it is never made public."}, {"type": "", "heading": "Reporting a private challenge", "body": "You can report it just like any other post, by tapping the 🚩 icon. Our moderation team will review it."}]},
    {"title": "4. Private Truths", "cards": [{"type": "truth", "badge": "truth", "badgeText": "TRUTH", "heading": "What is a private truth?", "body": "You send a statement about yourself or about whoever gets it —for example <em>I have never skipped a class</em>— and that person answers whether they think it is <strong>true</strong> or <strong>a lie</strong>. Sending it costs <strong>15 coins per person</strong>."}, {"type": "", "heading": "How to send a private truth", "steps": ["Side menu → <strong>Private truths</strong>.", "Tap <strong>New statement</strong> and write it.", "If you want to reuse it another day, turn on <strong>Save as template</strong>.", "Pick who gets it from the people you follow and send it."]}, {"type": "info", "heading": "Templates", "body": "With <strong>Save as template</strong> on, the statement stays in <strong>My truths</strong> and you can send it again whenever you want. If you leave it off, it is sent once and not saved."}, {"type": "", "heading": "How to answer", "steps": ["Open it from the notification or from <strong>Private truths</strong>.", "Answer <strong>True</strong> or <strong>Lie</strong>.", "Add a message if you want. It is optional."]}, {"type": "", "heading": "When does it get posted to the board?", "body": "Only if <strong>both of you</strong> vote yes. Then it shows up as <strong>Truth from @nick</strong>, with the statement and the answer. If either of you prefers to keep it private, it is never posted."}, {"type": "warning", "heading": "Expiry and refund", "body": "If nobody answers, the truth expires after <strong>5 days</strong> and the coins go back to whoever sent it. You can also cancel it yourself while it is still unanswered."}, {"type": "", "heading": "Reporting a private truth", "body": "Tap the 🚩 icon inside the truth. The team reviews it like any other content."}]},
    {"title": "5. The Board", "cards": [{"type": "", "heading": "Global & Following feeds", "body": "On the main screen you have two tabs:", "list": ["<strong>Global:</strong> posts from all users.", "<strong>Following:</strong> only from users you follow."], "bodyAfter": "Posts expire after 7 days."}, {"type": "", "heading": "Interact with posts", "list": ["❤️ <strong>Like</strong>", "👎 <strong>Dislike</strong>", "💬 <strong>Comments</strong>", "🔗 <strong>Share</strong>", "🚩 <strong>Report</strong>"]}]},
    {"title": "6. Friends & Followers", "cards": [{"type": "", "heading": "Search and follow users", "steps": ["Go to <strong>Friends</strong> menu.", "Tap the magnifying glass 🔍.", "Type the nick (minimum 2 characters).", "Tap <strong>Follow</strong>."]}, {"type": "", "heading": "View followers and following", "body": "On any profile, tap the <strong>followers</strong> or <strong>following</strong> count to see the full list. You can search by nick within the list."}, {"type": "warning", "heading": "Block a user", "steps": ["Go to the user's profile.", "Tap the 🚫 icon next to the report icon.", "Confirm the block in the dialog."], "bodyAfter": "When you block someone: you unfollow each other, you cannot access each other's profiles, you don't appear in searches and you won't see each other's posts."}, {"type": "", "heading": "Manage blocked users", "body": "Side menu → <strong>Blocked users</strong>. From there you can see all the users you have blocked and unblock them at any time."}]},
    {"title": "7. Invite a Friend", "cards": [{"type": "info", "heading": "How does it work?", "body": "Share your invitation code with a friend. As soon as they register using it, <strong>you'll both receive coins</strong> as a reward."}, {"type": "", "heading": "Where do I find my code?", "body": "Side menu → <strong>Invite a friend</strong>. From there you can share it through any app installed on your phone."}, {"type": "", "heading": "When do I get the reward?", "body": "It's triggered as soon as the invited person verifies their email, or immediately if they sign up with Google or Apple."}]},
    {"title": "8. Store & Coins", "cards": [{"type": "warning", "badge": "coins", "badgeText": "COINS", "heading": "How do I earn coins?", "body": "By completing challenges and truths:", "list": ["<strong>Dare</strong>: 40 EXP + 12 coins", "<strong>Truth</strong>: 15 EXP + 5 coins"]}, {"type": "", "heading": "Buy packs", "body": "Go to the <strong>Store</strong> menu and buy packs with your coins."}, {"type": "warning", "heading": "Rate Us", "body": "Tap <strong>Rate Us</strong> in the side menu to open the app's store listing (App Store or Google Play) and get <strong>100 coins</strong> as a gift. Only granted once per account."}, {"type": "", "heading": "Coins from surveys", "body": "Some team <strong>surveys</strong> also give coins when you answer them. See the Surveys section."}, {"type": "warning", "badge": "coins", "badgeText": "COINS", "heading": "Sales", "body": "Every now and then some packs go <strong>on sale</strong>: you will see the old price crossed out and the discount. They last as long as the sale does and you get the same coins as in the normal pack."}]},
    {"title": "9. Premium & Daily Wheel", "cards": [{"type": "info", "heading": "What is Premium?", "body": "A monthly subscription. While you have it, every day, instead of just getting your daily challenge, you <strong>spin a wheel</strong> that decides what you get. The price is set by your country's store and you see it before paying."}, {"type": "", "heading": "The four prizes", "body": "The wheel has four slots:", "list": ["<strong>Daily challenge:</strong> the usual one.", "<strong>Double reward:</strong> that challenge or truth pays twice the coins and EXP.", "<strong>You choose:</strong> you decide whether you want a challenge or a truth.", "<strong>Two in one:</strong> you get a challenge and a truth the same day."], "bodyAfter": "It is random, so some days are better than others."}, {"type": "warning", "heading": "How to spot the double one", "body": "The challenge or truth with the double reward carries an orange badge with a bolt and <strong>x2</strong> in your challenge list. You get twice the reward automatically when you complete it."}, {"type": "", "heading": "One spin a day", "body": "You can only spin once a day. Closing the wheel without spinning costs you nothing: the spin is still waiting for you and you can go back to it from the side menu → <strong>Daily wheel</strong>, which shows a badge while it is pending."}, {"type": "", "heading": "How to subscribe", "steps": ["<strong>Store</strong> menu → <strong>PREMIUM</strong> tab.", "Tap <strong>Subscribe</strong> and confirm the payment in your store.", "When it is done, if you still have a spin today, the wheel opens by itself."]}, {"type": "", "heading": "How to cancel", "body": "You cancel from your store: <strong>Google Play → Subscriptions</strong> or <strong>Settings → your Apple ID → Subscriptions</strong>. There is a shortcut in the PREMIUM tab. You stay Premium until the period you already paid for ends."}, {"type": "info", "heading": "New phone or reinstall", "body": "Tap <strong>Restore purchase</strong> in the PREMIUM tab. It recovers a subscription you already paid for with that same Google Play or App Store account. If it finds no purchase, it tells you."}, {"type": "", "heading": "The crown 👑", "body": "While you are Premium a crown shows up next to your name in the side menu."}]},
    {"title": "10. Surveys", "cards": [{"type": "info", "heading": "What are surveys?", "body": "From time to time the team sends you a short survey. You'll find it in the side menu under <strong>Surveys</strong>, with a number showing how many you have pending."}, {"type": "", "heading": "How do I answer?", "steps": ["Open the <strong>Surveys</strong> menu.", "Pick one and tap <strong>Answer</strong>.", "Answer each question (free text or by choosing an option) and tap <strong>Submit</strong>."]}, {"type": "warning", "badge": "coins", "badgeText": "COINS", "heading": "Reward", "body": "Some surveys give <strong>coins</strong> when you answer them. If so, you'll see how many before you start, and they're credited when you finish."}, {"type": "", "heading": "Can I ignore it?", "body": "Yes. Tap <strong>Ignore</strong> and it won't appear again."}]},
    {"title": "11. Pass & Play (Local Mode)", "cards": [{"type": "info", "heading": "What is Local Mode?", "body": "A local, pass-and-play game mode for a shared device, available to people aged <strong>16 and over</strong>."}, {"type": "", "heading": "Age verification", "body": "The first time you activate it, we ask for your date of birth just to check you're 16 or older. This check happens <strong>entirely on your device</strong>: we never send or store that date on our servers."}, {"type": "", "heading": "How to play", "steps": ["Side menu → <strong>Pass & Play</strong>.", "Confirm your age the first time you enter.", "Choose the intensity level and take turns passing the phone."]}]},
    {"title": "12. Your Profile", "cards": [{"type": "", "heading": "Edit profile", "body": "Side menu → <strong>Profile</strong> → edit icon ✏️. Change nick, name and photo."}, {"type": "", "heading": "Ranks & EXP", "body": "Complete challenges and truths to earn EXP and level up. There are 10 ranks in total.", "ranges": true}]},
    {"title": "13. Notifications", "cards": [{"type": "", "body": "You will receive notifications when:", "list": ["Someone follows you.", "Someone likes or comments on your post.", "Someone transfers a challenge or truth to you.", "Someone sends you or answers a private truth.", "Someone sends or responds to a private challenge.", "You level up."], "bodyAfter": "Access by tapping the bell 🔔. If you sign out, your device stops receiving notifications for that account."}]},
    {"title": "14. Report Content", "cards": [{"type": "", "heading": "How do I report?", "body": "Tap the 🚩 icon next to the share button (or inside a private challenge), select the reason and tap <strong>Send report</strong>."}, {"type": "", "heading": "Available reasons", "list": ["🔞 Sexual content", "👊 Violence", "📢 Spam", "🗣️ Hate speech", "❌ Misinformation", "💬 Other reason"]}, {"type": "info", "heading": "What happens after reporting?", "body": "Your report goes to the moderation team. You can only report each post (or private challenge) once."}, {"type": "info", "heading": "My reports", "body": "You can check the status of your reports in the side menu → <strong>My reports</strong>: <strong>In progress</strong>, <strong>Accepted</strong> or <strong>Rejected</strong>. If the team replies, you'll see their response there."}, {"type": "", "heading": "Cancel a report", "body": "While a report is <strong>In progress</strong>, you can cancel it from <strong>My reports</strong>."}, {"type": "", "heading": "Reporting a comment", "body": "In the comments of a post you can also tap 🚩 to report. The team reviews it and, if it gets removed, tells whoever wrote it why."}, {"type": "warning", "heading": "What is a Strike?", "body": "If you break the rules, the team can sanction your account. Each sanction adds a <strong>strike</strong> (shown next to your name). When you reach <strong>3 strikes</strong>, the account is permanently suspended."}]},
    {"title": "15. Social Media", "cards": [{"type": "info", "heading": "Follow us", "body": "Side menu → <strong>Social Media</strong>. You'll find direct links to our TikTok, Instagram, Facebook and Patreon, which open outside the app."}]},
    {"title": "16. FAQ", "cards": [{"type": "", "heading": "Why can't I log in?", "body": "Verify your email. If not done yet, we'll resend the link automatically."}, {"type": "", "heading": "Verification email not arriving?", "body": "Check spam. If still missing, try logging in to resend it. Also: <a href='mailto:devlicius.online@gmail.com'>devlicius.online@gmail.com</a>."}, {"type": "", "heading": "Do posts expire?", "body": "Yes, after <strong>7 days</strong>."}, {"type": "", "heading": "What about unanswered private challenges?", "body": "They expire after <strong>5 days</strong> and the coins are refunded to whoever sent the challenge."}, {"type": "", "heading": "Can I delete my account?", "body": "Yes. Side menu → <strong>Settings → Delete account</strong>. Irreversible action."}, {"type": "", "heading": "Is my data safe?", "body": "Yes. See our <a href='privacyPolicy.html'>Privacy Policy</a>."}, {"type": "warning", "heading": "How do I receive a prize?", "body": "We will contact you or send the prize to the email address you registered with. <strong>It is essential that you have access to that email</strong>, as it is the only way we will use to reach you."}]}
  ]
},
"de": {
  "headerSub": "Benutzerhandbuch und Hilfe",
  "title": "Benutzerhandbuch",
  "subtitle": "Alles, was du wissen musst",
  "intro": "Willkommen bei <strong>Verdad o Reto</strong>. Hier findest du eine vollständige Anleitung zur App.",
  "footer": "© 2026 Verdad o Reto · Jonatan Ortega González · Spanien",
  "contactText": "Kannst du nicht finden, was du suchst? Schreibe uns.",
  "sections": [
    {"title": "1. Registrierung & Konto", "cards": [{"type": "info", "heading": "Konto erstellen", "steps": ["Öffne die App und tippe auf <strong>Registrieren</strong>.", "Gib Nick, Name, E-Mail und Passwort ein.", "Akzeptiere die Datenschutzrichtlinie.", "Bestätige dein Konto per E-Mail."]}, {"type": "info", "heading": "Passwort vergessen", "steps": ["Tippe auf <strong>Passwort vergessen?</strong>", "Gib deine E-Mail ein und tippe auf <strong>Code senden</strong>.", "Gib den Code mit deinem neuen Passwort ein."]}, {"type": "info", "heading": "Passwort ändern", "body": "Seitenmenü → <strong>Einstellungen → Passwort ändern</strong>."}]},
    {"title": "2. Challenges & Wahrheiten", "cards": [{"type": "dare", "badge": "dare", "badgeText": "CHALLENGE", "heading": "Was ist eine Challenge?", "body": "Eine Challenge musst du durch ein Video beweisen."}, {"type": "truth", "badge": "truth", "badgeText": "WAHRHEIT", "heading": "Was ist eine Wahrheit?", "body": "Eine Frage, die du mit <strong>Wahr</strong> oder <strong>Falsch</strong> beantwortest."}, {"type": "", "heading": "Gesperrte Challenges 🔒", "body": "Tippe auf das Schloss und dann auf <strong>Challenge annehmen!</strong>"}, {"type": "", "heading": "Challenge abschließen", "steps": ["Menü <strong>Challenges</strong> → Tab <strong>Ausstehend</strong>.", "Gesperrte Challenge antippen.", "<strong>Machen</strong> tippen und Video auswählen (max. 1 Min.).", "<strong>Abschließen</strong> tippen."]}, {"type": "", "heading": "Wahrheit beantworten", "steps": ["Menü <strong>Challenges</strong> → Tab <strong>Ausstehend</strong>.", "Gesperrte Wahrheit antippen.", "<strong>WAHR</strong> oder <strong>FALSCH</strong> wählen.", "<strong>Abschließen</strong> tippen."]}, {"type": "", "heading": "Übertragen", "body": "Tippe auf <strong>Übertragen</strong>, wähle einen Benutzer und bestätige."}, {"type": "warning", "badge": "daily", "badgeText": "TÄGLICH", "heading": "Tägliche Challenge", "body": "Jeden Tag erhältst du eine besondere Challenge. Der Titel ist verborgen."}, {"type": "dare", "heading": "Saison-Challenges 🎃", "body": "Von Zeit zu Zeit sendet das Verdad o Reto-Team eine <strong>besondere Saison-Challenge</strong> (z. B. an Halloween oder Weihnachten). Sie erscheint direkt in deinen Challenges, offen und bereit zum Loslegen, und du erhältst eine Benachrichtigung. Du schließt sie wie jede andere Challenge ab."}]},
    {"title": "3. Private Challenges", "cards": [{"type": "dare", "heading": "Was ist eine private Challenge?", "body": "Du kannst einen Nutzer, dem du folgst, privat herausfordern. Das Antwort-Foto oder -Video sehen nur ihr beide, es sei denn, ihr entscheidet euch beide, es im Feed zu veröffentlichen."}, {"type": "", "heading": "Private Challenge senden", "steps": ["Gehe zum Profil eines Nutzers, dem du folgst.", "Tippe auf <strong>Privat herausfordern</strong> und wähle oder schreibe die Challenge.", "Sende sie ab. Das Senden kostet ein paar Münzen."]}, {"type": "", "heading": "Antworten", "steps": ["Öffne die private Challenge über deine Benachrichtigungen oder das Menü <strong>Private Challenges</strong>.", "Tippe auf <strong>Antworten</strong> und lade dein Foto oder Video hoch.", "Stimme ab, ob die Antwort im öffentlichen Feed veröffentlicht werden soll."]}, {"type": "warning", "heading": "Ablauf & Rückerstattung", "body": "Antwortet niemand, verfällt die Challenge nach <strong>5 Tagen</strong> und die Münzen werden automatisch an den Absender zurückerstattet. Du kannst sie auch selbst stornieren, solange sie unbeantwortet ist."}, {"type": "", "heading": "Wann wird sie im Feed veröffentlicht?", "body": "Nur wenn <strong>du und die andere Person</strong> beide dafür stimmen. Stimmt einer von euch dagegen, bleibt sie privat."}, {"type": "", "heading": "Private Challenge melden", "body": "Du kannst sie wie jeden anderen Beitrag über das 🚩-Symbol melden. Unser Moderationsteam prüft die Meldung."}]},
    {"title": "4. Private Wahrheiten", "cards": [{"type": "truth", "badge": "truth", "badgeText": "WAHRHEIT", "heading": "Was ist eine private Wahrheit?", "body": "Du schickst eine Behauptung über dich oder über die Person, die sie bekommt —zum Beispiel <em>ich habe noch nie eine Stunde geschwänzt</em>— und diese Person antwortet, ob sie sie für <strong>wahr</strong> oder für <strong>gelogen</strong> hält. Das Verschicken kostet <strong>15 Münzen pro Person</strong>."}, {"type": "", "heading": "So verschickst du eine private Wahrheit", "steps": ["Seitenmenü → <strong>Private Wahrheiten</strong>.", "Tippe auf <strong>Neue Behauptung</strong> und schreib sie.", "Wenn du sie später wiederverwenden willst, aktiviere <strong>Als Vorlage speichern</strong>.", "Wähle aus den Leuten, denen du folgst, wer sie bekommt, und schick sie ab."]}, {"type": "info", "heading": "Vorlagen", "body": "Mit <strong>Als Vorlage speichern</strong> bleibt die Behauptung in <strong>Meine Wahrheiten</strong> und du kannst sie jederzeit erneut verschicken. Lässt du es aus, wird sie einmal verschickt und nicht gespeichert."}, {"type": "", "heading": "So antwortest du", "steps": ["Öffne sie über die Benachrichtigung oder über <strong>Private Wahrheiten</strong>.", "Antworte <strong>Wahr</strong> oder <strong>Gelogen</strong>.", "Wenn du magst, schreib eine Nachricht dazu. Das ist freiwillig."]}, {"type": "", "heading": "Wann landet sie auf dem Board?", "body": "Nur wenn <strong>ihr beide</strong> dafür stimmt. Dann erscheint sie als <strong>Wahrheit von @nick</strong>, mit Behauptung und Antwort. Will einer von euch, dass es privat bleibt, wird sie nie gepostet."}, {"type": "warning", "heading": "Ablauf und Erstattung", "body": "Antwortet niemand, läuft die Wahrheit nach <strong>5 Tagen</strong> ab und die Münzen gehen zurück an den Absender. Solange sie unbeantwortet ist, kannst du sie auch selbst zurückziehen."}, {"type": "", "heading": "Eine private Wahrheit melden", "body": "Tippe in der Wahrheit auf das 🚩-Symbol. Das Team prüft sie wie jeden anderen Inhalt."}]},
    {"title": "5. Das Board", "cards": [{"type": "", "heading": "Global & Folgend", "body": "Zwei Tabs auf dem Hauptbildschirm:", "list": ["<strong>Global:</strong> Beiträge aller Benutzer.", "<strong>Folgend:</strong> nur Benutzer, denen du folgst."], "bodyAfter": "Beiträge verfallen nach 7 Tagen."}, {"type": "", "heading": "Mit Beiträgen interagieren", "list": ["❤️ Like", "👎 Dislike", "💬 Kommentare", "🔗 Teilen", "🚩 Melden"]}]},
    {"title": "6. Freunde", "cards": [{"type": "", "heading": "Benutzer suchen", "steps": ["Menü <strong>Freunde</strong>.", "Lupe 🔍 antippen.", "Nick eingeben (min. 2 Zeichen).", "<strong>Folgen</strong> tippen."]}, {"type": "", "heading": "Follower und Folgende anzeigen", "body": "Tippe auf einem Profil auf die Anzahl der <strong>Follower</strong> oder <strong>Folgenden</strong>, um die vollständige Liste zu sehen. Du kannst darin nach Nick suchen."}, {"type": "warning", "heading": "Benutzer blockieren", "steps": ["Gehe zum Profil des Benutzers.", "Tippe auf das 🚫-Symbol neben dem Melden-Symbol.", "Bestätige die Blockierung im Dialog."], "bodyAfter": "Beim Blockieren: ihr folgt euch gegenseitig nicht mehr, könnt nicht auf eure Profile zugreifen, erscheint nicht in der Suche und seht keine Beiträge voneinander."}, {"type": "", "heading": "Blockierte Benutzer verwalten", "body": "Seitenmenü → <strong>Blockierte Benutzer</strong>. Dort siehst du alle blockierten Benutzer und kannst sie jederzeit entblockieren."}]},
    {"title": "7. Freund einladen", "cards": [{"type": "info", "heading": "Wie funktioniert das?", "body": "Teile deinen Einladungscode mit einem Freund. Sobald er sich damit registriert, erhaltet <strong>ihr beide Münzen</strong> als Belohnung."}, {"type": "", "heading": "Wo finde ich meinen Code?", "body": "Seitenmenü → <strong>Freund einladen</strong>. Von dort kannst du ihn über jede auf deinem Handy installierte App teilen."}, {"type": "", "heading": "Wann erhalte ich die Belohnung?", "body": "Sie wird ausgelöst, sobald die eingeladene Person ihre E-Mail bestätigt, oder sofort, wenn sie sich mit Google oder Apple registriert."}]},
    {"title": "8. Shop & Münzen", "cards": [{"type": "warning", "badge": "coins", "badgeText": "MÜNZEN", "heading": "Münzen verdienen", "body": "Durch Abschließen von Challenges:", "list": ["<strong>Challenge</strong>: 40 EXP + 12 Münzen", "<strong>Wahrheit</strong>: 15 EXP + 5 Münzen"]}, {"type": "", "heading": "Pakete kaufen", "body": "Gehe zum <strong>Shop</strong>-Menü."}, {"type": "warning", "heading": "Bewerte uns", "body": "Tippe im Seitenmenü auf <strong>Bewerte uns</strong>, um die Store-Seite der App (App Store oder Google Play) zu öffnen, und erhalte <strong>100 Münzen</strong> geschenkt. Wird nur einmal pro Konto vergeben."}, {"type": "", "heading": "Münzen durch Umfragen", "body": "Manche <strong>Umfragen</strong> des Teams geben ebenfalls Münzen, wenn du sie beantwortest. Siehe den Abschnitt Umfragen."}, {"type": "warning", "badge": "coins", "badgeText": "MÜNZEN", "heading": "Angebote", "body": "Ab und zu sind einige Pakete im <strong>Angebot</strong>: du siehst den alten Preis durchgestrichen und den Rabatt. Sie gelten so lange wie das Angebot, und du bekommst dieselben Münzen wie im normalen Paket."}]},
    {"title": "9. Premium & Tagesrad", "cards": [{"type": "info", "heading": "Was ist Premium?", "body": "Ein Monatsabo. Solange du es hast, bekommst du deine Tages-Challenge nicht einfach so, sondern <strong>drehst jeden Tag ein Rad</strong>, das entscheidet, was du kriegst. Den Preis legt der Store deines Landes fest, und du siehst ihn vor dem Bezahlen."}, {"type": "", "heading": "Die vier Gewinne", "body": "Das Rad hat vier Felder:", "list": ["<strong>Tages-Challenge:</strong> das Übliche.", "<strong>Doppelte Belohnung:</strong> diese Challenge oder Wahrheit gibt doppelt so viele Münzen und EXP.", "<strong>Du entscheidest:</strong> du wählst zwischen Challenge und Wahrheit.", "<strong>Zwei an einem Tag:</strong> du bekommst eine Challenge und eine Wahrheit."], "bodyAfter": "Es ist Zufall, manche Tage laufen also besser als andere."}, {"type": "warning", "heading": "Woran du die doppelte erkennst", "body": "Die Challenge oder Wahrheit mit doppelter Belohnung trägt in deiner Liste ein oranges Abzeichen mit Blitz und <strong>x2</strong>. Beim Abschließen bekommst du automatisch das Doppelte."}, {"type": "", "heading": "Eine Drehung pro Tag", "body": "Du kannst nur einmal am Tag drehen. Das Rad ohne Drehen zu schließen kostet dich nichts: die Drehung wartet weiter auf dich, und du kommst über das Seitenmenü → <strong>Tagesrad</strong> zurück, das solange ein Abzeichen zeigt."}, {"type": "", "heading": "So abonnierst du", "steps": ["Menü <strong>Shop</strong> → Reiter <strong>PREMIUM</strong>.", "Tippe auf <strong>Abonnieren</strong> und bestätige die Zahlung in deinem Store.", "Wenn du danach heute noch eine Drehung hast, öffnet sich das Rad von selbst."]}, {"type": "", "heading": "So kündigst du", "body": "Gekündigt wird im Store: <strong>Google Play → Abos</strong> oder <strong>Einstellungen → deine Apple-ID → Abos</strong>. Im PREMIUM-Reiter gibt es eine Abkürzung dahin. Premium bleibst du bis zum Ende des bereits bezahlten Zeitraums."}, {"type": "info", "heading": "Neues Handy oder Neuinstallation", "body": "Tippe im PREMIUM-Reiter auf <strong>Kauf wiederherstellen</strong>. Damit holst du ein Abo zurück, das du mit demselben Google-Play- oder App-Store-Konto bezahlt hast. Findet es keinen Kauf, sagt es dir das."}, {"type": "", "heading": "Die Krone 👑", "body": "Solange du Premium bist, erscheint im Seitenmenü eine Krone neben deinem Namen."}]},
    {"title": "10. Umfragen", "cards": [{"type": "info", "heading": "Was sind Umfragen?", "body": "Von Zeit zu Zeit sendet dir das Team eine kurze Umfrage. Du findest sie im Seitenmenü unter <strong>Umfragen</strong>, mit einer Zahl, die anzeigt, wie viele offen sind."}, {"type": "", "heading": "Wie beantworte ich sie?", "steps": ["Öffne das Menü <strong>Umfragen</strong>.", "Wähle eine aus und tippe auf <strong>Beantworten</strong>.", "Beantworte jede Frage (Freitext oder Auswahl einer Option) und tippe auf <strong>Absenden</strong>."]}, {"type": "warning", "badge": "coins", "badgeText": "MÜNZEN", "heading": "Belohnung", "body": "Manche Umfragen geben <strong>Münzen</strong>, wenn du sie beantwortest. In dem Fall siehst du vorher, wie viele, und sie werden dir am Ende gutgeschrieben."}, {"type": "", "heading": "Kann ich sie ignorieren?", "body": "Ja. Tippe auf <strong>Ignorieren</strong> und sie erscheint nicht mehr."}]},
    {"title": "11. Lokaler Modus", "cards": [{"type": "info", "heading": "Was ist der Lokale Modus?", "body": "Ein lokaler Spielmodus für ein gemeinsam genutztes Gerät, verfügbar für Personen ab <strong>16 Jahren</strong>."}, {"type": "", "heading": "Altersverifizierung", "body": "Beim ersten Aktivieren fragen wir nach deinem Geburtsdatum, nur um zu prüfen, ob du 16 Jahre oder älter bist. Diese Prüfung erfolgt <strong>vollständig auf deinem Gerät</strong>: Wir senden oder speichern dieses Datum nie auf unseren Servern."}, {"type": "", "heading": "So spielst du", "steps": ["Seitenmenü → <strong>Lokaler Modus</strong>.", "Bestätige beim ersten Mal dein Alter.", "Wähle die Intensitätsstufe und spielt abwechselnd mit demselben Handy."]}]},
    {"title": "12. Profil", "cards": [{"type": "", "heading": "Profil bearbeiten", "body": "Seitenmenü → <strong>Profil</strong> → ✏️. Nick, Name und Foto ändern."}, {"type": "", "heading": "Ränge & EXP", "body": "Es gibt 10 Ränge. Verdiene EXP durch Abschließen von Challenges.", "ranges": true}]},
    {"title": "13. Benachrichtigungen", "cards": [{"type": "", "body": "Du erhältst Benachrichtigungen wenn:", "list": ["Jemand dir folgt.", "Jemand deinen Beitrag liked oder kommentiert.", "Jemand dir eine Challenge überträgt.", "Jemand schickt dir eine private Wahrheit oder beantwortet sie.", "Jemand dir eine private Challenge sendet oder beantwortet.", "Du aufsteigst."], "bodyAfter": "Tippe auf die Glocke 🔔. Nach dem Abmelden erhält dein Gerät keine Benachrichtigungen mehr für dieses Konto."}]},
    {"title": "14. Melden", "cards": [{"type": "", "heading": "Wie melde ich?", "body": "Tippe auf 🚩 neben dem Teilen-Button (oder innerhalb einer privaten Challenge)."}, {"type": "", "heading": "Meldegründe", "list": ["🔞 Sexueller Inhalt", "👊 Gewalt", "📢 Spam", "🗣️ Hassrede", "❌ Fehlinformationen", "💬 Anderer Grund"]}, {"type": "info", "heading": "Was passiert danach?", "body": "Deine Meldung geht ans Moderationsteam. Jeder Beitrag (oder jede private Challenge) kann nur einmal gemeldet werden."}, {"type": "info", "heading": "Meine Meldungen", "body": "Den Status deiner Meldungen siehst du im Seitenmenü → <strong>Meine Meldungen</strong>: <strong>In Bearbeitung</strong>, <strong>Akzeptiert</strong> oder <strong>Abgelehnt</strong>. Wenn das Team antwortet, siehst du dort die Antwort."}, {"type": "", "heading": "Eine Meldung zurückziehen", "body": "Solange eine Meldung <strong>In Bearbeitung</strong> ist, kannst du sie unter <strong>Meine Meldungen</strong> zurückziehen."}, {"type": "", "heading": "Einen Kommentar melden", "body": "Auch in den Kommentaren eines Beitrags kannst du auf 🚩 tippen, um zu melden. Das Team prüft ihn und sagt der Person, die ihn geschrieben hat, den Grund, falls er entfernt wird."}, {"type": "warning", "heading": "Was ist ein Strike?", "body": "Wenn du gegen die Regeln verstößt, kann das Team dein Konto sanktionieren. Jede Sanktion ergibt einen <strong>Strike</strong> (neben deinem Namen sichtbar). Bei <strong>3 Strikes</strong> wird das Konto dauerhaft gesperrt."}]},
    {"title": "15. Soziale Netzwerke", "cards": [{"type": "info", "heading": "Folge uns", "body": "Seitenmenü → <strong>Soziale Netzwerke</strong>. Dort findest du direkte Links zu unserem TikTok, Instagram, Facebook und Patreon, die außerhalb der App geöffnet werden."}]},
    {"title": "16. FAQ", "cards": [{"type": "", "heading": "Warum kann ich mich nicht einloggen?", "body": "Stelle sicher, dass deine E-Mail verifiziert ist."}, {"type": "", "heading": "E-Mail kommt nicht an?", "body": "Spam-Ordner prüfen. Beim Login wird sie erneut gesendet. Kontakt: <a href='mailto:devlicius.online@gmail.com'>devlicius.online@gmail.com</a>."}, {"type": "", "heading": "Verfallen Beiträge?", "body": "Ja, nach <strong>7 Tagen</strong>."}, {"type": "", "heading": "Und unbeantwortete private Challenges?", "body": "Sie verfallen nach <strong>5 Tagen</strong>, und die Münzen werden an den Absender zurückerstattet."}, {"type": "", "heading": "Konto löschen?", "body": "Seitenmenü → <strong>Einstellungen → Konto löschen</strong>."}, {"type": "", "heading": "Sind meine Daten sicher?", "body": "Ja. Siehe <a href='privacyPolicy.html'>Datenschutzrichtlinie</a>."}, {"type": "warning", "heading": "Wie erhalte ich einen Preis?", "body": "Wir kontaktieren dich oder senden den Preis an die E-Mail-Adresse, mit der du dich registriert hast. <strong>Es ist wichtig, dass du Zugang zu dieser E-Mail hast</strong>, da dies der einzige Weg ist, über den wir dich erreichen werden."}]}
  ]
},
"zh": {
  "headerSub": "用户指南和帮助",
  "title": "用户指南",
  "subtitle": "开始使用所需了解的一切",
  "intro": "欢迎使用 <strong>Verdad o Reto</strong>。这里有完整的使用指南。",
  "footer": "© 2026 Verdad o Reto · Jonatan Ortega González · 西班牙",
  "contactText": "找不到你需要的内容？给我们写信。",
  "sections": [
    {"title": "1. 注册与账户", "cards": [{"type": "info", "heading": "如何创建账户", "steps": ["打开应用并点击<strong>注册</strong>。", "填写昵称、姓名、邮箱和密码。", "接受隐私政策。", "验证邮箱。"]}, {"type": "info", "heading": "忘记密码", "steps": ["点击<strong>忘记密码？</strong>", "输入邮箱并点击<strong>发送验证码</strong>。", "输入验证码和新密码。"]}, {"type": "info", "heading": "更改密码", "body": "侧边菜单 → <strong>设置 → 修改密码</strong>。"}]},
    {"title": "2. 挑战与真相", "cards": [{"type": "dare", "badge": "dare", "badgeText": "挑战", "heading": "什么是挑战？", "body": "你需要录制视频证明完成的任务。"}, {"type": "truth", "badge": "truth", "badgeText": "真相", "heading": "什么是真相？", "body": "用<strong>真</strong>或<strong>假</strong>回答的问题。"}, {"type": "", "heading": "锁定的挑战 🔒", "body": "点击锁定图标，然后点击<strong>接受挑战！</strong>"}, {"type": "", "heading": "如何完成挑战", "steps": ["进入<strong>挑战</strong>菜单 → <strong>待处理</strong>标签。", "点击锁定的挑战。", "点击<strong>执行</strong>并选择视频（最多1分钟）。", "点击<strong>完成</strong>。"]}, {"type": "", "heading": "如何完成真相", "steps": ["进入<strong>挑战</strong>菜单 → <strong>待处理</strong>标签。", "点击锁定的真相。", "选择<strong>真</strong>或<strong>假</strong>。", "点击<strong>完成</strong>。"]}, {"type": "", "heading": "转让", "body": "点击<strong>转让</strong>，选择用户并确认。"}, {"type": "warning", "badge": "daily", "badgeText": "每日", "heading": "每日挑战", "body": "每天自动分配一个特殊挑战，标题打开前隐藏。"}, {"type": "dare", "heading": "季节挑战 🎃", "body": "Verdad o Reto 团队会不定期发送<strong>特别的季节挑战</strong>（例如在万圣节或圣诞节）。它会直接以开启状态出现在你的挑战中，随时可以完成，并且你会收到通知。完成方式与其他挑战相同。"}]},
    {"title": "3. 私密挑战", "cards": [{"type": "dare", "heading": "什么是私密挑战？", "body": "你可以私下向你关注的用户发起挑战。回应的照片或视频只有你们两人可见，除非你们都选择将其发布到动态中。"}, {"type": "", "heading": "如何发送私密挑战", "steps": ["进入你关注的用户的资料页。", "点击<strong>私下挑战</strong>并选择或输入挑战内容。", "发送。发送会消耗少量金币。"]}, {"type": "", "heading": "如何回应", "steps": ["从通知或<strong>私密挑战</strong>菜单打开该挑战。", "点击<strong>回应</strong>并上传你的照片或视频。", "投票决定是否将回应发布到公开动态中。"]}, {"type": "warning", "heading": "过期与退款", "body": "如果无人回应，挑战将在<strong>5天</strong>后过期，金币会自动退还给发起者。在未被回应之前，你也可以自行取消。"}, {"type": "", "heading": "什么时候会发布到动态？", "body": "只有当<strong>你和对方都</strong>投票同意发布时才会公开。只要有一方希望保持私密，就永远不会公开。"}, {"type": "", "heading": "举报私密挑战", "body": "你可以像举报其他帖子一样，点击 🚩 图标举报。我们的审核团队会进行审查。"}]},
    {"title": "4. 私密真话", "cards": [{"type": "truth", "badge": "truth", "badgeText": "真话", "heading": "什么是私密真话？", "body": "你发送一句关于自己或关于收件人的说法——比如<em>我从没逃过课</em>——对方回答他认为这是<strong>真话</strong>还是<strong>谎话</strong>。每发给一个人需要<strong>15金币</strong>。"}, {"type": "", "heading": "如何发送私密真话", "steps": ["侧边菜单 → <strong>私密真话</strong>。", "点击<strong>新建说法</strong>并写下内容。", "如果以后还想再用，打开<strong>保存为模板</strong>。", "从你关注的人中选择收件人并发送。"]}, {"type": "info", "heading": "模板", "body": "打开<strong>保存为模板</strong>后，这句说法会留在<strong>我的真话</strong>里，随时可以再次发送。不打开的话，只发送一次，不会保存。"}, {"type": "", "heading": "如何回答", "steps": ["从通知或<strong>私密真话</strong>菜单打开它。", "回答<strong>真话</strong>或<strong>谎话</strong>。", "可以附上一条留言，不是必填的。"]}, {"type": "", "heading": "什么时候会发布到公告板？", "body": "只有<strong>你们两个人</strong>都投票同意才会发布。发布后显示为<strong>来自 @昵称 的真话</strong>，包含说法和回答。只要有一方想保持私密，就永远不会公开。"}, {"type": "warning", "heading": "过期与退款", "body": "如果没有人回答，这句真话会在<strong>5天</strong>后过期，金币退还给发送者。在被回答之前，你也可以自行取消。"}, {"type": "", "heading": "举报私密真话", "body": "在真话内点击 🚩 图标。团队会像审核其他内容一样进行审核。"}]},
    {"title": "5. 公告板", "cards": [{"type": "", "heading": "全局与关注动态", "body": "主屏幕有两个标签：", "list": ["<strong>全局：</strong>所有用户的帖子。", "<strong>关注：</strong>你关注用户的帖子。"], "bodyAfter": "帖子7天后自动过期。"}, {"type": "", "heading": "与帖子互动", "list": ["❤️ 点赞", "👎 踩", "💬 评论", "🔗 分享", "🚩 举报"]}]},
    {"title": "6. 朋友与粉丝", "cards": [{"type": "", "heading": "搜索并关注用户", "steps": ["进入<strong>朋友</strong>菜单。", "点击放大镜 🔍。", "输入昵称（至少2个字符）。", "点击<strong>关注</strong>。"]}, {"type": "", "heading": "查看粉丝和关注列表", "body": "在任何用户资料中，点击<strong>粉丝</strong>或<strong>关注</strong>数量即可查看完整列表。可以在列表中按昵称搜索。"}, {"type": "warning", "heading": "屏蔽用户", "steps": ["进入该用户的资料。", "点击举报图标旁的 🚫 图标。", "在对话框中确认屏蔽。"], "bodyAfter": "屏蔽后：双方互相取消关注，无法访问对方资料，不出现在搜索中，也看不到对方的帖子。"}, {"type": "", "heading": "管理已屏蔽的用户", "body": "侧边菜单 → <strong>已屏蔽用户</strong>。在那里可以查看所有已屏蔽的用户，并随时解除屏蔽。"}]},
    {"title": "7. 邀请好友", "cards": [{"type": "info", "heading": "如何运作？", "body": "把你的邀请码分享给朋友。对方使用该邀请码注册后，<strong>你们两人都会获得金币</strong>奖励。"}, {"type": "", "heading": "在哪里找到我的邀请码？", "body": "侧边菜单 → <strong>邀请好友</strong>。你可以从那里通过手机上安装的任何应用分享它。"}, {"type": "", "heading": "什么时候能获得奖励？", "body": "在被邀请人验证邮箱后触发；如果对方使用Google或Apple注册，则会立即触发。"}]},
    {"title": "8. 商店与金币", "cards": [{"type": "warning", "badge": "coins", "badgeText": "金币", "heading": "如何获得金币？", "body": "完成挑战和真相：", "list": ["<strong>挑战</strong>：40 EXP + 12金币", "<strong>真相</strong>：15 EXP + 5金币"]}, {"type": "", "heading": "购买礼包", "body": "进入<strong>商店</strong>菜单购买礼包。"}, {"type": "warning", "heading": "给我们评分", "body": "在侧边菜单点击<strong>给我们评分</strong>，打开应用在商店（App Store 或 Google Play）中的页面，即可获得<strong>100金币</strong>赠礼。每个账户仅可获得一次。"}, {"type": "", "heading": "通过问卷获得金币", "body": "团队的部分<strong>问卷</strong>在回答后也会给予金币。请参阅问卷调查部分。"}, {"type": "warning", "badge": "coins", "badgeText": "金币", "heading": "优惠", "body": "有时候部分礼包会<strong>打折</strong>：你会看到划掉的原价和折扣。优惠期内有效，获得的金币和普通礼包一样。"}]},
    {"title": "9. 高级会员与每日转盘", "cards": [{"type": "info", "heading": "什么是高级会员？", "body": "一个按月订阅。开通期间，你每天不再直接收到每日挑战，而是<strong>转一次转盘</strong>，由它决定你得到什么。价格由你所在国家的应用商店设定，付款前就能看到。"}, {"type": "", "heading": "四种奖励", "body": "转盘上有四格：", "list": ["<strong>每日挑战：</strong>和平时一样。", "<strong>双倍奖励：</strong>这个挑战或真话给双倍金币和经验。", "<strong>由你选择：</strong>你来决定要挑战还是真话。", "<strong>二合一：</strong>同一天同时收到一个挑战和一个真话。"], "bodyAfter": "结果是随机的，有些日子会比其他日子更好。"}, {"type": "warning", "heading": "怎么看出哪个是双倍的", "body": "带双倍奖励的挑战或真话，会在你的列表里带一个橙色闪电<strong>x2</strong>标记。完成时会自动给你双倍奖励。"}, {"type": "", "heading": "每天只能转一次", "body": "每天只能转一次。没转就关掉也不会有损失：这次机会仍然为你保留，可以从侧边菜单 → <strong>每日转盘</strong>回来，在此期间那里会显示一个提示点。"}, {"type": "", "heading": "如何订阅", "steps": ["<strong>商店</strong>菜单 → <strong>高级会员</strong>标签页。", "点击<strong>订阅</strong>并在你的商店中确认付款。", "完成后，如果今天还有机会，转盘会自动打开。"]}, {"type": "", "heading": "如何取消", "body": "在你的商店中取消：<strong>Google Play → 订阅</strong>，或<strong>设置 → Apple ID → 订阅</strong>。高级会员标签页里有快捷入口。已付费的周期结束前，你仍然是高级会员。"}, {"type": "info", "heading": "换手机或重新安装", "body": "在高级会员标签页点击<strong>恢复购买</strong>。它会找回你用同一个 Google Play 或 App Store 账号已经付费的订阅。如果没有找到购买记录，会告诉你。"}, {"type": "", "heading": "皇冠 👑", "body": "只要你是高级会员，侧边菜单里你的名字旁边就会有一顶皇冠。"}]},
    {"title": "10. 问卷调查", "cards": [{"type": "info", "heading": "什么是问卷？", "body": "团队会不定期向你发送简短的问卷。你可以在侧边菜单的<strong>问卷调查</strong>中找到它，旁边的数字表示你有多少份待完成。"}, {"type": "", "heading": "如何回答？", "steps": ["打开<strong>问卷调查</strong>菜单。", "选择一份并点击<strong>回答</strong>。", "回答每个问题（自由填写或选择一个选项），然后点击<strong>提交</strong>。"]}, {"type": "warning", "badge": "coins", "badgeText": "金币", "heading": "奖励", "body": "部分问卷在回答后会给予<strong>金币</strong>。如果有奖励，你在开始前就能看到数量，完成后会自动发放。"}, {"type": "", "heading": "可以忽略吗？", "body": "可以。点击<strong>忽略</strong>，它就不会再出现。"}]},
    {"title": "11. 本地模式", "cards": [{"type": "info", "heading": "什么是本地模式？", "body": "一种在同一设备上轮流游玩的本地游戏模式，面向<strong>16岁及以上</strong>人群。"}, {"type": "", "heading": "年龄验证", "body": "首次开启时，我们会要求你提供出生日期，仅用于核实你是否年满16岁。此核实<strong>完全在你的设备上进行</strong>：我们绝不会将该日期发送或存储到我们的服务器。"}, {"type": "", "heading": "如何游玩", "steps": ["侧边菜单 → <strong>本地模式</strong>。", "首次进入时确认你的年龄。", "选择强度等级，轮流传递手机进行游戏。"]}]},
    {"title": "12. 个人资料", "cards": [{"type": "", "heading": "编辑资料", "body": "侧边菜单 → <strong>个人资料</strong> → ✏️。"}, {"type": "", "heading": "等级与EXP", "body": "共有10个等级。完成挑战获得EXP升级。", "ranges": true}]},
    {"title": "13. 通知", "cards": [{"type": "", "body": "以下情况收到通知：", "list": ["有人关注你。", "有人点赞或评论你的帖子。", "有人向你转让挑战。", "有人给你发送私密真话或回答了你的私密真话。", "有人向你发送或回应私密挑战。", "你升级了。"], "bodyAfter": "点击铃铛 🔔 查看通知。退出登录后，你的设备将不再接收该账户的通知。"}]},
    {"title": "14. 举报内容", "cards": [{"type": "", "heading": "如何举报？", "body": "点击分享按钮旁（或私密挑战内）的 🚩 图标。"}, {"type": "", "heading": "举报原因", "list": ["🔞 色情内容", "👊 暴力", "📢 垃圾信息", "🗣️ 仇恨言论", "❌ 虚假信息", "💬 其他原因"]}, {"type": "info", "heading": "举报后会发生什么？", "body": "报告发送给管理团队。每个帖子（或私密挑战）只能举报一次。"}, {"type": "info", "heading": "我的举报", "body": "你可以在侧边菜单 → <strong>我的举报</strong>中查看举报状态：<strong>处理中</strong>、<strong>已接受</strong>或<strong>已拒绝</strong>。如果团队回复，你会在那里看到回复。"}, {"type": "", "heading": "取消举报", "body": "当举报处于<strong>处理中</strong>时，你可以在<strong>我的举报</strong>中取消它。"}, {"type": "", "heading": "举报评论", "body": "在帖子的评论里也可以点击 🚩 举报。团队会进行审核，如果被删除，会把原因告知发表评论的人。"}, {"type": "warning", "heading": "什么是 Strike（违规记录）？", "body": "如果你违反规则，团队可能会处罚你的账户。每次处罚会增加一个 <strong>strike</strong>（显示在你的名字旁）。累计 <strong>3 个 strike</strong> 后，账户将被永久封禁。"}]},
    {"title": "15. 社交媒体", "cards": [{"type": "info", "heading": "关注我们", "body": "侧边菜单 → <strong>社交媒体</strong>。你可以找到直接链接到我们TikTok、Instagram、Facebook和Patreon的入口，这些链接会在应用外打开。"}]},

const rangesData = [{"es": "Novato", "en": "Novice", "de": "Neuling", "zh": "新手", "exp": "0 - 299", "img": "novato"}, {"es": "Curioso", "en": "Curious", "de": "Neugierig", "zh": "好奇者", "exp": "300 - 999", "img": "curioso"}, {"es": "Activo", "en": "Active", "de": "Aktiv", "zh": "活跃", "exp": "1.000 - 2.199", "img": "activo"}, {"es": "Habitual", "en": "Regular", "de": "Regelmäßig", "zh": "常客", "exp": "2.200 - 5.999", "img": "habitual"}, {"es": "Atrevido", "en": "Daring", "de": "Mutig", "zh": "大胆", "exp": "6.000 - 11.999", "img": "atrevido"}, {"es": "Influyente", "en": "Influential", "de": "Einflussreich", "zh": "有影响力", "exp": "12.000 - 24.999", "img": "influyente"}, {"es": "Imparable", "en": "Unstoppable", "de": "Unaufhaltsam", "zh": "势不可挡", "exp": "25.000 - 49.999", "img": "imparable"}, {"es": "Élite", "en": "Elite", "de": "Elite", "zh": "精英", "exp": "50.000 - 89.999", "img": "elite"}, {"es": "Leyenda", "en": "Legend", "de": "Legende", "zh": "传奇", "exp": "90.000 - 129.999", "img": "leyenda"}, {"es": "Mítico", "en": "Mythic", "de": "Mythisch", "zh": "神话", "exp": "130.000+", "img": "mitico"}];

function getRangeName(r, lang) {
  if (lang==='en') return r.en;
  if (lang==='de') return r.de;
  if (lang==='zh') return r.zh;
  return r.es;
}

function buildRanges(lang) {
  const base = "https://github.com/jona234/verdadoreto-web/blob/main/assets/icons/rangos/";
  return '<div class="ranges-grid">' + rangesData.map(r =>
    '<div class="range-item">' +
    '<img src="' + base + r.img + '.png?raw=true" alt="' + getRangeName(r,lang) + '" style="width:40px;height:40px;object-fit:contain;flex-shrink:0">' +
    '<div class="range-info">' +
    '<span class="range-name">' + getRangeName(r,lang) + '</span>' +
    '<span class="range-exp">' + r.exp + ' EXP</span>' +
    '</div></div>'
  ).join('') + '</div>';
}

function buildCard(card, lang) {
  let h = '<div class="card ' + (card.type||'') + '">';
  if (card.badge) h += '<span class="badge ' + card.badge + '">' + card.badgeText + '</span>';
  if (card.heading) h += '<h3>' + card.heading + '</h3>';
  if (card.body) h += '<p>' + card.body + '</p>';
  if (card.steps) card.steps.forEach((s,i) => { h += '<p class="step"><span class="step-number">'+(i+1)+'.</span> '+s+'</p>'; });
  if (card.list) h += '<ul>' + card.list.map(l => '<li>'+l+'</li>').join('') + '</ul>';
  if (card.bodyAfter) h += '<p>' + card.bodyAfter + '</p>';
  if (card.ranges) h += buildRanges(lang);
  return h + '</div>';
}

function render(lang) {
  const t = translations[lang] || translations['es'];
  document.getElementById('header-sub').textContent = t.headerSub;
  document.title = t.headerSub + ' — Verdad o Reto';
  document.getElementById('footer-text').textContent = t.footer;
  let html = '<h1>' + t.title + '</h1><span class="subtitle">' + t.subtitle + '</span><p>' + t.intro + '</p>';
  t.sections.forEach(function(section) {
    html += '<h2>' + section.title + '</h2>';
    section.cards.forEach(function(card) { html += buildCard(card, lang); });
  });
  html += '<div class="contact-box"><p>' + t.contactText + '</p><a href="mailto:devlicius.online@gmail.com">devlicius.online@gmail.com</a></div>';
  document.getElementById('content').innerHTML = html;
}

const params = new URLSearchParams(window.location.search);
const lang = params.get('lang') || 'es';
render(['es','en','de','zh'].includes(lang) ? lang : 'es');
