"en": {
  "headerSub": "User guide and help",
  "title": "User Guide",
  "subtitle": "Everything you need to know to get started",
  "intro": "Welcome to <strong>Truth or Dare</strong>, the app where you can accept challenges, answer truths and share your achievements with friends.",
  "footer": "© 2026 Verdad o Reto · Jonatan Ortega González · Spain",
  "contactText": "Can't find what you're looking for? Write to us and we'll help.",
  "sections": [
    {"title": "1. Registration & Account", "cards": [{"type": "info", "heading": "How to create an account", "steps": ["Open the app and tap <strong>Sign up</strong>.", "Fill in your nick, name, email and password.", "Accept the privacy policy and tap <strong>Register</strong>.", "Check your email and confirm your account."]}, {"type": "info", "heading": "I forgot my password", "steps": ["On the login screen tap <strong>Forgot your password? Recover it</strong>.", "Enter your email and tap <strong>Send code</strong>.", "Check your email, copy the code and enter it with your new password."]}, {"type": "info", "heading": "Change password (with active session)", "body": "Open side menu → <strong>Settings → Change password</strong>."}]},
    {"title": "2. Challenges & Truths", "cards": [{"type": "dare", "badge": "dare", "badgeText": "DARE", "heading": "What is a dare?", "body": "A dare is a challenge you must complete by recording a video as proof."}, {"type": "truth", "badge": "truth", "badgeText": "TRUTH", "heading": "What is a truth?", "body": "A truth is a question you must answer with <strong>True</strong> or <strong>False</strong>."}, {"type": "", "heading": "Locked challenges & truths 🔒", "body": "They appear with a padlock. Tap to see details and tap <strong>Accept challenge!</strong> to unlock."}, {"type": "", "heading": "How to complete a dare", "steps": ["Go to <strong>Challenges</strong> menu → <strong>Pending</strong> tab.", "Tap the locked dare to open it.", "Tap <strong>Do it</strong> and select a video (max 1 minute).", "Tap <strong>Complete</strong>."]}, {"type": "", "heading": "How to complete a truth", "steps": ["Go to <strong>Challenges</strong> menu → <strong>Pending</strong> tab.", "Tap the locked truth to open it.", "Read the question and select <strong>TRUE</strong> or <strong>FALSE</strong>.", "Tap <strong>Complete</strong>."]}, {"type": "", "heading": "Transfer a challenge or truth", "body": "Tap <strong>Transfer</strong>, choose a user you follow and confirm."}, {"type": "warning", "badge": "daily", "badgeText": "DAILY", "heading": "Daily challenge / truth", "body": "Every day you receive a special one marked <strong>DAILY</strong>. The title is hidden until you open it."}, {"type": "dare", "heading": "Seasonal challenges 🎃", "body": "From time to time, the Verdad o Reto team sends a <strong>special seasonal challenge</strong> (for example, at Halloween or Christmas). It appears directly in your challenges, open and ready to do, and you get a notification about it. You complete it just like any other challenge."}]},
    {"title": "3. Private Challenges", "cards": [{"type": "dare", "heading": "What is a private challenge?", "body": "You can privately challenge a user you follow. The response photo or video is only seen by the two of you, unless you both choose to publish it to the feed."}, {"type": "", "heading": "How to send a private challenge", "steps": ["Go to the profile of a user you follow.", "Tap <strong>Challenge privately</strong> and write or pick the challenge.", "Send it. Sending has a small coin cost."]}, {"type": "", "heading": "How to respond", "steps": ["Open the private challenge from your notifications or the <strong>Private Challenges</strong> menu.", "Tap <strong>Respond</strong> and upload your photo or video.", "Vote whether you want the response published to the public feed."]}, {"type": "warning", "heading": "Expiry & refund", "body": "If nobody responds, the challenge expires after <strong>5 days</strong> and the coins are automatically refunded to whoever sent it. You can also cancel it yourself while it's unanswered."}, {"type": "", "heading": "When does it get published to the feed?", "body": "Only if <strong>both you and the other person</strong> vote to publish it. If either of you prefers to keep it private, it is never made public."}, {"type": "", "heading": "Reporting a private challenge", "body": "You can report it just like any other post, by tapping the 🚩 icon. Our moderation team will review it."}]},
    {"title": "4. The Board", "cards": [{"type": "", "heading": "Global & Following feeds", "body": "On the main screen you have two tabs:", "list": ["<strong>Global:</strong> posts from all users.", "<strong>Following:</strong> only from users you follow."], "bodyAfter": "Posts expire after 7 days."}, {"type": "", "heading": "Interact with posts", "list": ["❤️ <strong>Like</strong>", "👎 <strong>Dislike</strong>", "💬 <strong>Comments</strong>", "🔗 <strong>Share</strong>", "🚩 <strong>Report</strong>"]}]},
    {"title": "5. Friends & Followers", "cards": [{"type": "", "heading": "Search and follow users", "steps": ["Go to <strong>Friends</strong> menu.", "Tap the magnifying glass 🔍.", "Type the nick (minimum 2 characters).", "Tap <strong>Follow</strong>."]}, {"type": "", "heading": "View followers and following", "body": "On any profile, tap the <strong>followers</strong> or <strong>following</strong> count to see the full list. You can search by nick within the list."}, {"type": "warning", "heading": "Block a user", "steps": ["Go to the user's profile.", "Tap the 🚫 icon next to the report icon.", "Confirm the block in the dialog."], "bodyAfter": "When you block someone: you unfollow each other, you cannot access each other's profiles, you don't appear in searches and you won't see each other's posts."}, {"type": "", "heading": "Manage blocked users", "body": "Side menu → <strong>Blocked users</strong>. From there you can see all the users you have blocked and unblock them at any time."}]},
    {"title": "6. Invite a Friend", "cards": [{"type": "info", "heading": "How does it work?", "body": "Share your invitation code with a friend. As soon as they register using it, <strong>you'll both receive coins</strong> as a reward."}, {"type": "", "heading": "Where do I find my code?", "body": "Side menu → <strong>Invite a friend</strong>. From there you can share it through any app installed on your phone."}, {"type": "", "heading": "When do I get the reward?", "body": "It's triggered as soon as the invited person verifies their email, or immediately if they sign up with Google or Apple."}]},
    {"title": "7. Store & Coins", "cards": [{"type": "warning", "badge": "coins", "badgeText": "COINS", "heading": "How do I earn coins?", "body": "By completing challenges and truths:", "list": ["<strong>Dare</strong>: 40 EXP + 12 coins", "<strong>Truth</strong>: 15 EXP + 5 coins"]}, {"type": "", "heading": "Buy packs", "body": "Go to the <strong>Store</strong> menu and buy packs with your coins."}, {"type": "warning", "heading": "Rate Us", "body": "Tap <strong>Rate Us</strong> in the side menu to open the app's store listing (App Store or Google Play) and get <strong>100 coins</strong> as a gift. Only granted once per account."}]},
    {"title": "8. Pass & Play (Local Mode)", "cards": [{"type": "info", "heading": "What is Local Mode?", "body": "A local, pass-and-play game mode for a shared device, available to people aged <strong>16 and over</strong>."}, {"type": "", "heading": "Age verification", "body": "The first time you activate it, we ask for your date of birth just to check you're 16 or older. This check happens <strong>entirely on your device</strong>: we never send or store that date on our servers."}, {"type": "", "heading": "How to play", "steps": ["Side menu → <strong>Pass & Play</strong>.", "Confirm your age the first time you enter.", "Choose the intensity level and take turns passing the phone."]}]},
    {"title": "9. Your Profile", "cards": [{"type": "", "heading": "Edit profile", "body": "Side menu → <strong>Profile</strong> → edit icon ✏️. Change nick, name and photo."}, {"type": "", "heading": "Ranks & EXP", "body": "Complete challenges and truths to earn EXP and level up. There are 10 ranks in total.", "ranges": true}]},
    {"title": "10. Notifications", "cards": [{"type": "", "body": "You will receive notifications when:", "list": ["Someone follows you.", "Someone likes or comments on your post.", "Someone transfers a challenge or truth to you.", "Someone sends or responds to a private challenge.", "You level up."], "bodyAfter": "Access by tapping the bell 🔔. If you sign out, your device stops receiving notifications for that account."}]},
    {"title": "11. Report Content", "cards": [{"type": "", "heading": "How do I report?", "body": "Tap the 🚩 icon next to the share button (or inside a private challenge), select the reason and tap <strong>Send report</strong>."}, {"type": "", "heading": "Available reasons", "list": ["🔞 Sexual content", "👊 Violence", "📢 Spam", "🗣️ Hate speech", "❌ Misinformation", "💬 Other reason"]}, {"type": "info", "heading": "What happens after reporting?", "body": "Your report goes to the moderation team. You can only report each post (or private challenge) once."}]},
    {"title": "12. Social Media", "cards": [{"type": "info", "heading": "Follow us", "body": "Side menu → <strong>Social Media</strong>. You'll find direct links to our TikTok, Instagram, Facebook and Patreon, which open outside the app."}]},
    {"title": "13. FAQ", "cards": [{"type": "", "heading": "Why can't I log in?", "body": "Verify your email. If not done yet, we'll resend the link automatically."}, {"type": "", "heading": "Verification email not arriving?", "body": "Check spam. If still missing, try logging in to resend it. Also: <a href='mailto:devlicius.online@gmail.com'>devlicius.online@gmail.com</a>."}, {"type": "", "heading": "Do posts expire?", "body": "Yes, after <strong>7 days</strong>."}, {"type": "", "heading": "What about unanswered private challenges?", "body": "They expire after <strong>5 days</strong> and the coins are refunded to whoever sent the challenge."}, {"type": "", "heading": "Can I delete my account?", "body": "Yes. Side menu → <strong>Settings → Delete account</strong>. Irreversible action."}, {"type": "", "heading": "Is my data safe?", "body": "Yes. See our <a href='privacyPolicy.html'>Privacy Policy</a>."}, {"type": "warning", "heading": "How do I receive a prize?", "body": "We will contact you or send the prize to the email address you registered with. <strong>It is essential that you have access to that email</strong>, as it is the only way we will use to reach you."}]}
  ]
},

    {"title": "3. Private Challenges", "cards": [{"type": "dare", "heading": "Was ist eine private Challenge?", "body": "Du kannst einen Nutzer, dem du folgst, privat herausfordern. Das Antwort-Foto oder -Video sehen nur ihr beide, es sei denn, ihr entscheidet euch beide, es im Feed zu veröffentlichen."}, {"type": "", "heading": "Private Challenge senden", "steps": ["Gehe zum Profil eines Nutzers, dem du folgst.", "Tippe auf <strong>Privat herausfordern</strong> und wähle oder schreibe die Challenge.", "Sende sie ab. Das Senden kostet ein paar Münzen."]}, {"type": "", "heading": "Antworten", "steps": ["Öffne die private Challenge über deine Benachrichtigungen oder das Menü <strong>Private Challenges</strong>.", "Tippe auf <strong>Antworten</strong> und lade dein Foto oder Video hoch.", "Stimme ab, ob die Antwort im öffentlichen Feed veröffentlicht werden soll."]}, {"type": "warning", "heading": "Ablauf & Rückerstattung", "body": "Antwortet niemand, verfällt die Challenge nach <strong>5 Tagen</strong> und die Münzen werden automatisch an den Absender zurückerstattet. Du kannst sie auch selbst stornieren, solange sie unbeantwortet ist."}, {"type": "", "heading": "Wann wird sie im Feed veröffentlicht?", "body": "Nur wenn <strong>du und die andere Person</strong> beide dafür stimmen. Stimmt einer von euch dagegen, bleibt sie privat."}, {"type": "", "heading": "Private Challenge melden", "body": "Du kannst sie wie jeden anderen Beitrag über das 🚩-Symbol melden. Unser Moderationsteam prüft die Meldung."}]},
    {"title": "4. Das Board", "cards": [{"type": "", "heading": "Global & Folgend", "body": "Zwei Tabs auf dem Hauptbildschirm:", "list": ["<strong>Global:</strong> Beiträge aller Benutzer.", "<strong>Folgend:</strong> nur Benutzer, denen du folgst."], "bodyAfter": "Beiträge verfallen nach 7 Tagen."}, {"type": "", "heading": "Mit Beiträgen interagieren", "list": ["❤️ Like", "👎 Dislike", "💬 Kommentare", "🔗 Teilen", "🚩 Melden"]}]},
    {"title": "5. Freunde", "cards": [{"type": "", "heading": "Benutzer suchen", "steps": ["Menü <strong>Freunde</strong>.", "Lupe 🔍 antippen.", "Nick eingeben (min. 2 Zeichen).", "<strong>Folgen</strong> tippen."]}, {"type": "", "heading": "Follower und Folgende anzeigen", "body": "Tippe auf einem Profil auf die Anzahl der <strong>Follower</strong> oder <strong>Folgenden</strong>, um die vollständige Liste zu sehen. Du kannst darin nach Nick suchen."}, {"type": "warning", "heading": "Benutzer blockieren", "steps": ["Gehe zum Profil des Benutzers.", "Tippe auf das 🚫-Symbol neben dem Melden-Symbol.", "Bestätige die Blockierung im Dialog."], "bodyAfter": "Beim Blockieren: ihr folgt euch gegenseitig nicht mehr, könnt nicht auf eure Profile zugreifen, erscheint nicht in der Suche und seht keine Beiträge voneinander."}, {"type": "", "heading": "Blockierte Benutzer verwalten", "body": "Seitenmenü → <strong>Blockierte Benutzer</strong>. Dort siehst du alle blockierten Benutzer und kannst sie jederzeit entblockieren."}]},
    {"title": "6. Freund einladen", "cards": [{"type": "info", "heading": "Wie funktioniert das?", "body": "Teile deinen Einladungscode mit einem Freund. Sobald er sich damit registriert, erhaltet <strong>ihr beide Münzen</strong> als Belohnung."}, {"type": "", "heading": "Wo finde ich meinen Code?", "body": "Seitenmenü → <strong>Freund einladen</strong>. Von dort kannst du ihn über jede auf deinem Handy installierte App teilen."}, {"type": "", "heading": "Wann erhalte ich die Belohnung?", "body": "Sie wird ausgelöst, sobald die eingeladene Person ihre E-Mail bestätigt, oder sofort, wenn sie sich mit Google oder Apple registriert."}]},
    {"title": "7. Shop & Münzen", "cards": [{"type": "warning", "badge": "coins", "badgeText": "MÜNZEN", "heading": "Münzen verdienen", "body": "Durch Abschließen von Challenges:", "list": ["<strong>Challenge</strong>: 40 EXP + 12 Münzen", "<strong>Wahrheit</strong>: 15 EXP + 5 Münzen"]}, {"type": "", "heading": "Pakete kaufen", "body": "Gehe zum <strong>Shop</strong>-Menü."}, {"type": "warning", "heading": "Bewerte uns", "body": "Tippe im Seitenmenü auf <strong>Bewerte uns</strong>, um die Store-Seite der App (App Store oder Google Play) zu öffnen, und erhalte <strong>100 Münzen</strong> geschenkt. Wird nur einmal pro Konto vergeben."}]},
    {"title": "8. Lokaler Modus", "cards": [{"type": "info", "heading": "Was ist der Lokale Modus?", "body": "Ein lokaler Spielmodus für ein gemeinsam genutztes Gerät, verfügbar für Personen ab <strong>16 Jahren</strong>."}, {"type": "", "heading": "Altersverifizierung", "body": "Beim ersten Aktivieren fragen wir nach deinem Geburtsdatum, nur um zu prüfen, ob du 16 Jahre oder älter bist. Diese Prüfung erfolgt <strong>vollständig auf deinem Gerät</strong>: Wir senden oder speichern dieses Datum nie auf unseren Servern."}, {"type": "", "heading": "So spielst du", "steps": ["Seitenmenü → <strong>Lokaler Modus</strong>.", "Bestätige beim ersten Mal dein Alter.", "Wähle die Intensitätsstufe und spielt abwechselnd mit demselben Handy."]}]},
    {"title": "9. Profil", "cards": [{"type": "", "heading": "Profil bearbeiten", "body": "Seitenmenü → <strong>Profil</strong> → ✏️. Nick, Name und Foto ändern."}, {"type": "", "heading": "Ränge & EXP", "body": "Es gibt 10 Ränge. Verdiene EXP durch Abschließen von Challenges.", "ranges": true}]},

    {"title": "11. Melden", "cards": [{"type": "", "heading": "Wie melde ich?", "body": "Tippe auf 🚩 neben dem Teilen-Button (oder innerhalb einer privaten Challenge)."}, {"type": "", "heading": "Meldegründe", "list": ["🔞 Sexueller Inhalt", "👊 Gewalt", "📢 Spam", "🗣️ Hassrede", "❌ Fehlinformationen", "💬 Anderer Grund"]}, {"type": "info", "heading": "Was passiert danach?", "body": "Deine Meldung geht ans Moderationsteam. Jeder Beitrag (oder jede private Challenge) kann nur einmal gemeldet werden."}]},
    {"title": "12. Soziale Netzwerke", "cards": [{"type": "info", "heading": "Folge uns", "body": "Seitenmenü → <strong>Soziale Netzwerke</strong>. Dort findest du direkte Links zu unserem TikTok, Instagram, Facebook und Patreon, die außerhalb der App geöffnet werden."}]},
    {"title": "13. FAQ", "cards": [{"type": "", "heading": "Warum kann ich mich nicht einloggen?", "body": "Stelle sicher, dass deine E-Mail verifiziert ist."}, {"type": "", "heading": "E-Mail kommt nicht an?", "body": "Spam-Ordner prüfen. Beim Login wird sie erneut gesendet. Kontakt: <a href='mailto:devlicius.online@gmail.com'>devlicius.online@gmail.com</a>."}, {"type": "", "heading": "Verfallen Beiträge?", "body": "Ja, nach <strong>7 Tagen</strong>."}, {"type": "", "heading": "Und unbeantwortete private Challenges?", "body": "Sie verfallen nach <strong>5 Tagen</strong>, und die Münzen werden an den Absender zurückerstattet."}, {"type": "", "heading": "Konto löschen?", "body": "Seitenmenü → <strong>Einstellungen → Konto löschen</strong>."}, {"type": "", "heading": "Sind meine Daten sicher?", "body": "Ja. Siehe <a href='privacyPolicy.html'>Datenschutzrichtlinie</a>."}, {"type": "warning", "heading": "Wie erhalte ich einen Preis?", "body": "Wir kontaktieren dich oder senden den Preis an die E-Mail-Adresse, mit der du dich registriert hast. <strong>Es ist wichtig, dass du Zugang zu dieser E-Mail hast</strong>, da dies der einzige Weg ist, über den wir dich erreichen werden."}]}

  return r.es;
}

function buildRanges(lang) {
  const base = "https://github.com/jona234/verdadoreto-web/blob/main/assets/icons/rangos/";
  return '<div class="ranges-grid">' + rangesData.map(r =>
    '<div class="range-item">' +
    '<img src="' + base + r.img + '.png?raw=true" alt="' + getRangeName(r,lang) + '" style="width:40px;height:40px;object-fit:contain;flex-shrink:0">' +
    '<div class="range-info">' +
    '<span class="range-name">' + getRangeName(r,lang) + '</span>' +
    '<span class="range-exp">' + r.exp + ' EXP</span>' +
    '</div></div>'
  ).join('') + '</div>';
}

function buildCard(card, lang) {
  let h = '<div class="card ' + (card.type||'') + '">';
  if (card.badge) h += '<span class="badge ' + card.badge + '">' + card.badgeText + '</span>';
  if (card.heading) h += '<h3>' + card.heading + '</h3>';
  if (card.body) h += '<p>' + card.body + '</p>';
  if (card.steps) card.steps.forEach((s,i) => { h += '<p class="step"><span class="step-number">'+(i+1)+'.</span> '+s+'</p>'; });
  if (card.list) h += '<ul>' + card.list.map(l => '<li>'+l+'</li>').join('') + '</ul>';
  if (card.bodyAfter) h += '<p>' + card.bodyAfter + '</p>';
  if (card.ranges) h += buildRanges(lang);
  return h + '</div>';
}

function render(lang) {
  const t = translations[lang] || translations['es'];
  document.getElementById('header-sub').textContent = t.headerSub;
  document.title = t.headerSub + ' — Verdad o Reto';
  document.getElementById('footer-text').textContent = t.footer;
  let html = '<h1>' + t.title + '</h1><span class="subtitle">' + t.subtitle + '</span><p>' + t.intro + '</p>';
  t.sections.forEach(function(section) {
    html += '<h2>' + section.title + '</h2>';
    section.cards.forEach(function(card) { html += buildCard(card, lang); });
  });
  html += '<div class="contact-box"><p>' + t.contactText + '</p><a href="mailto:devlicius.online@gmail.com">devlicius.online@gmail.com</a></div>';
  document.getElementById('content').innerHTML = html;
}

const params = new URLSearchParams(window.location.search);
const lang = params.get('lang') || 'es';
render(['es','en','de','zh'].includes(lang) ? lang : 'es');

</script>
