<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verdad o Reto — ¿Te atreves?</title>
<meta name="description" content="El juego social donde los retos se graban, las verdades se confiesan y tus hazañas se comparten con el mundo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--pink:#E8185A;--gold:#F5C842;--cream:#FFF0D6;--dark:#0D0A0E;--dark2:#140F17;--dark3:#1E1625;--text:#F0E8F5;--muted:#9980AA}
html{scroll-behavior:smooth}
body{background:var(--dark);color:var(--text);font-family:'Inter',sans-serif;overflow-x:hidden}
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.5rem 3rem;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(232,24,90,.18) 0%,transparent 70%),radial-gradient(ellipse 60% 40% at 80% 80%,rgba(245,200,66,.08) 0%,transparent 60%);pointer-events:none}
.hero-logo{width:clamp(130px,28vw,200px);height:clamp(130px,28vw,200px);object-fit:contain;filter:drop-shadow(0 0 40px rgba(232,24,90,.5));animation:float 4s ease-in-out infinite;margin-bottom:1.8rem;position:relative;z-index:1}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.hero-eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.25em;text-transform:uppercase;color:var(--pink);margin-bottom:.75rem;position:relative;z-index:1}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(3.5rem,14vw,9rem);line-height:.92;letter-spacing:.02em;color:var(--cream);position:relative;z-index:1}
.hero-title span{color:var(--pink);display:block}
.hero-sub{font-size:clamp(1rem,2.5vw,1.2rem);color:var(--muted);max-width:520px;margin:1.5rem auto 2.5rem;line-height:1.6;position:relative;z-index:1}
.lang-switcher{position:fixed;top:1rem;right:1rem;display:flex;gap:.4rem;z-index:100}
.lang-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:var(--text);border-radius:8px;padding:.3rem .6rem;font-size:.75rem;font-weight:600;cursor:pointer;transition:background .15s}
.lang-btn:hover,.lang-btn.active{background:var(--pink);border-color:var(--pink)}
.btn-group{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;position:relative;z-index:1}
.btn-store{display:flex;align-items:center;gap:.65rem;padding:.85rem 1.6rem;border-radius:14px;text-decoration:none;font-weight:600;font-size:.95rem;transition:transform .18s ease,box-shadow .18s ease;border:none;cursor:pointer}
.btn-store:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.4)}
.btn-appstore{background:#fff;color:#000}
.btn-google{background:var(--pink);color:#fff}
.btn-label{display:flex;flex-direction:column;line-height:1.2}
.btn-label small{font-size:.68rem;font-weight:400;opacity:.7}
.features{padding:5rem 1.5rem;max-width:900px;margin:0 auto}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,6vw,3.5rem);text-align:center;margin-bottom:3rem;color:var(--cream)}
.section-title em{font-style:normal;color:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.25rem}
.card{background:var(--dark3);border:1px solid rgba(232,24,90,.12);border-radius:16px;padding:1.5rem;transition:border-color .2s,transform .2s}
.card:hover{border-color:rgba(232,24,90,.4);transform:translateY(-4px)}
.card-icon{font-size:1.8rem;margin-bottom:.75rem}
.card h3{font-size:1rem;font-weight:700;margin-bottom:.4rem;color:var(--cream)}
.card p{font-size:.88rem;color:var(--muted);line-height:1.55}
.ranks{background:var(--dark2);padding:5rem 1.5rem;text-align:center}
.rank-strip{display:flex;justify-content:center;flex-wrap:wrap;gap:.6rem;margin-top:2rem;max-width:700px;margin-left:auto;margin-right:auto}
.rank-pill{background:var(--dark3);border:1px solid rgba(245,200,66,.2);border-radius:100px;padding:.45rem 1rem;font-size:.82rem;font-weight:600;color:var(--gold);letter-spacing:.05em}
.cta{padding:5rem 1.5rem 4rem;text-align:center;position:relative;overflow:hidden}
.cta::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 80% at 50% 100%,rgba(232,24,90,.15) 0%,transparent 70%);pointer-events:none}
.cta-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.5rem,8vw,5rem);color:var(--cream);margin-bottom:.5rem;position:relative;z-index:1}
.cta p{color:var(--muted);margin-bottom:2.5rem;font-size:1rem;position:relative;z-index:1}
.cta .btn-group{position:relative;z-index:1}
footer{border-top:1px solid rgba(255,255,255,.06);padding:1.5rem;text-align:center;font-size:.78rem;color:var(--muted)}
footer a{color:var(--muted);text-decoration:underline}
@media(prefers-reduced-motion:reduce){.hero-logo{animation:none}.card,.btn-store{transition:none}}
@media(max-width:480px){.btn-store{width:100%;justify-content:center}.btn-group{flex-direction:column;align-items:center}}
</style>
</head>
<body>

<div class="lang-switcher">
  <button class="lang-btn" onclick="setLang('es')">ES</button>
  <button class="lang-btn" onclick="setLang('en')">EN</button>
  <button class="lang-btn" onclick="setLang('de')">DE</button>
  <button class="lang-btn" onclick="setLang('zh')">中文</button>
</div>

function setLang(lang) {
  const d = t[lang] || t.es;
  document.documentElement.lang = lang;
  document.title = lang === 'zh' ? '真心话大冒险 — 你敢吗？' : lang === 'de' ? 'Wahrheit oder Challenge — Traust du dich?' : lang === 'en' ? 'Truth or Dare — Do you dare?' : 'Verdad o Reto — ¿Te atreves?';

  document.getElementById('eyebrow').textContent = d.eyebrow;
  const t1 = document.getElementById('title-line1');
  t1.innerHTML = d.titleLine1 + '<span>' + d.titleLine2 + '</span>';
  document.getElementById('sub').textContent = d.sub;

  document.getElementById('ios-small').textContent = d.iosSmall;
  document.getElementById('ios-label').textContent = d.iosLabel;
  document.getElementById('android-small').textContent = d.androidSmall;
  document.getElementById('android-label').textContent = d.androidLabel;
  document.getElementById('ios-small2').textContent = d.iosSmall;
  document.getElementById('ios-label2').textContent = d.iosLabel;
  document.getElementById('android-small2').textContent = d.androidSmall;
  document.getElementById('android-label2').textContent = d.androidLabel;

  const fTitle = d.featuresTitle.replace(d.featuresTitleEm, '<em>' + d.featuresTitleEm + '</em>');
  document.getElementById('features-title').innerHTML = fTitle;
  document.getElementById('features-grid').innerHTML = d.features.map(f =>
    '<div class="card"><div class="card-icon">' + f.icon + '</div><h3>' + f.title + '</h3><p>' + f.desc + '</p></div>'
  ).join('');

  const rTitle = d.ranksTitle.replace(d.ranksTitleEm, '<em>' + d.ranksTitleEm + '</em>');
  document.getElementById('ranks-title').innerHTML = rTitle;
  document.getElementById('ranks-sub').textContent = d.ranksSub;
  document.getElementById('ranks-strip').innerHTML = d.ranks.map(r => '<span class="rank-pill">' + r + '</span>').join('');

  document.getElementById('cta-title').textContent = d.ctaTitle;
  document.getElementById('cta-sub').textContent = d.ctaSub;
  document.getElementById('footer-text').innerHTML = d.footer;

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent === (lang === 'zh' ? '中文' : lang.toUpperCase()));
  });

  const params = new URLSearchParams(window.location.search);
  params.set('lang', lang);
  window.history.replaceState({}, '', '?' + params.toString());
}

const params = new URLSearchParams(window.location.search);
const lang = params.get('lang') || (navigator.language || 'es').slice(0,2);
setLang(['es','en','de','zh'].includes(lang) ? lang : 'es');
