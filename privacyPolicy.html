os retos disponibles en Verdad o Reto están creados y revisados por nuestro equipo. Al aceptar y realizar cualquier reto, el usuario se compromete a:", "list": ["Realizarlo de forma segura y responsable.", "No llevar a cabo ninguna acción que pueda ser ilegal, peligrosa o que ponga en riesgo su integridad física o la de terceros.", "No publicar vídeos que muestren actividades ilegales, violentas o que puedan causar daño a otras personas."], "bodyAfter": "Verdad o Reto no se hace responsable de las acciones que los usuarios lleven a cabo fuera de los límites de un uso responsable de la aplicación."}]},

  "contactText": "Do you have any questions about your privacy?",
  "intro": "At <strong>Verdad o Reto</strong> we take user privacy very seriously. This policy explains what data we collect, how we use it and what your rights are, in accordance with the <strong>General Data Protection Regulation (GDPR)</strong> and applicable Spanish law.",
  "sections": [
    {"title": "1. Data Controller", "cards": [{"type": "info", "lines": ["<strong>Name:</strong> Jonatan Ortega González", "<strong>Country:</strong> Spain", "<strong>Email:</strong> <a href='mailto:devlicius.online@gmail.com'>devlicius.online@gmail.com</a>"]}]},
    {"title": "2. Data We Collect", "cards": [{"type": "", "body": "When you register and use the app, we collect:", "list": ["<strong>Registration data:</strong> email, nick, name and surname.", "<strong>Profile picture:</strong> image voluntarily uploaded.", "<strong>Generated content:</strong> posts, comments and reactions.", "<strong>Private challenge content:</strong> photos and videos you share with another user through a private challenge (duel), visible only between the two of you unless you both choose to publish it to the feed.", "<strong>Referral data:</strong> if you use or share an invitation code, we record which account referred which, so we can assign the corresponding reward.", "<strong>Technical data:</strong> session, authentication tokens and the device's push notification token.", "<strong>Usage & analytics data:</strong> information about how you interact with the app and about the effectiveness of our advertising campaigns, processed in aggregated form through <strong>Google Analytics for Firebase</strong>."], "bodyAfter": "We do <strong>not collect</strong> location data, financial data or sensitive information. We also do not collect or store your date of birth when you enter it for Local Mode (see section 10)."}]},

    {"title": "4. Legal Basis", "cards": [{"type": "", "body": "Processing of your data is based on the following legal grounds, as applicable:", "list": ["<strong>Performance of a contract:</strong> to create your account and let you use the app.", "<strong>Consent:</strong> for your profile picture, the promotional use of your content and, where applicable, notifications.", "<strong>Legitimate interest:</strong> to analyse app usage and measure the effectiveness of our advertising campaigns in aggregated form, without tracking you individually across other apps or websites.", "<strong>Compliance with legal obligations:</strong> where required by applicable law."]}]},
    {"title": "5. Storage & Security", "cards": [{"type": "", "body": "Your data is stored on secure servers. Passwords are encrypted. Videos and images are hosted on <strong>Cloudinary</strong>. We take technical and organisational measures to protect your information."}]},
    {"title": "6. Providers & Data Sharing", "cards": [{"type": "", "body": "We do not sell or share your data for commercial purposes with third parties outside the app. We only share data with technology providers necessary for the app's operation, who may only process your data on our instructions and in accordance with applicable law:", "list": ["<strong>Database:</strong> MongoDB.", "<strong>User authentication:</strong> Google Sign-In and Sign in with Apple.", "<strong>Image & video storage:</strong> Cloudinary.", "<strong>Push notifications:</strong> Firebase Cloud Messaging (FCM).", "<strong>Analytics & advertising measurement:</strong> Google Analytics for Firebase (Google).", "<strong>Email delivery:</strong> Brevo."], "bodyAfter": "Analytics and the measurement of our advertising campaigns are carried out in aggregated form; we do not use identifiers to track you individually across different apps or websites. Some of these providers may process data outside the European Economic Area (EEA). In such cases, we ensure international transfers comply with the GDPR through standard contractual clauses or other appropriate legal safeguards."}]},
    {"title": "7. Data Retention", "cards": [{"type": "", "body": "We keep your data while your account is active. If you delete your account, we will delete your personal data within a maximum of <strong>30 days</strong>, except data we must retain to comply with legal obligations."}]},
    {"title": "8. Private Challenges (Duels)", "cards": [{"type": "warning", "body": "You can privately challenge a user you follow. Regarding this content:", "list": ["The response photo or video is uploaded to <strong>Cloudinary</strong> and is visible only between the user who issues the challenge and the one who responds.", "The content is only made public on the feed if <strong>both users</strong> expressly vote to publish it. If either of them votes not to publish it, it remains private and closed.", "If the challenge goes unanswered, it expires after <strong>5 days</strong>. Once closed (rejected, cancelled, expired or resolved) and with no further activity, we permanently delete the record and its media from Cloudinary within a maximum of <strong>7 days</strong>, unless it has already been published to the public feed.", "You can report a private challenge just like any other post, using the 🚩 icon. The report is reviewed by our moderation team."]}]},
    {"title": "9. Referral Program", "cards": [{"type": "", "body": "When you invite a friend with your invitation code, or register using someone else's code, we store on both accounts which user referred which, solely to distribute the corresponding virtual-coin reward. This reward is triggered once the referred account verifies its email or signs in with Google or Apple, as a measure to prevent fraud from fake accounts."}]},
    {"title": "10. Local Age Verification (Local Mode)", "cards": [{"type": "info", "body": "<strong>Local Mode</strong> (a local, pass-and-play game for people aged 16 and over on a shared device) asks for your date of birth to check that you meet the minimum age. This check is performed <strong>entirely on your device</strong>: we do not send or store your date of birth on our servers. Only a local confirmation that you passed this check is saved on your phone."}]},
    {"title": "11. Social Media Links", "cards": [{"type": "", "body": "The app includes links to our external profiles on TikTok, Instagram, Facebook and Patreon. These are outbound links that open the corresponding app or browser outside of Verdad o Reto: we do not share your data with these platforms when you tap them. If you choose to visit them, each platform's own privacy policy will apply."}]},
    {"title": "12. Ranking Prize", "cards": [{"type": "warning", "body": "Top-ranked users may receive a prize. If you win:", "list": ["We will contact you via the <strong>email address you used to register</strong>, within a maximum of <strong>15 days</strong> after the ranking period ends.", "Please make sure you have access to that email, as it is the only channel we will use to notify you.", "If we do not receive a response from you within that period, the prize may be declared void or assigned to another participant.", "Your data will not be shared with third parties in connection with the prize delivery."]}]},
    {"title": "13. User-Generated Content", "cards": [{"type": "", "body": "By posting content (photos, videos, comments or reactions) on Verdad o Reto, you warrant that you hold the necessary rights over that content and that it does not infringe third-party rights.", "bodyAfter": "You also grant us a non-exclusive, royalty-free, worldwide licence to display and use that content within the app, as well as for Verdad o Reto's promotional and advertising purposes (for example, on social media or in marketing materials), for as long as it remains published. This licence applies to content you publish publicly in the app: content from a private challenge that never gets published to the feed remains private between the users involved and is not used for advertising purposes. If you do not want your public content used for advertising purposes, you can write to us at <a href='mailto:devlicius.online@gmail.com'>devlicius.online@gmail.com</a>."}]},
    {"title": "14. Your Rights", "cards": [{"type": "", "body": "As a user, you have the right to:", "list": ["<strong>Access:</strong> know what data we hold.", "<strong>Rectification:</strong> correct inaccurate data.", "<strong>Erasure:</strong> request deletion.", "<strong>Portability:</strong> receive your data in a structured format.", "<strong>Objection:</strong> object to processing.", "<strong>Withdraw consent:</strong> at any time."], "bodyAfter": "Write to us at <a href='mailto:devlicius.online@gmail.com'>devlicius.online@gmail.com</a> to exercise your rights. You may also lodge a complaint with the <strong>Spanish Data Protection Agency (AEPD)</strong> if you believe your rights have not been respected, at <a href='https://www.aepd.es' target='_blank'>www.aepd.es</a>. To delete your account and data, visit our <a href='delete-account.html?lang=en'>account deletion page</a>."}]},
    {"title": "15. Minors", "cards": [{"type": "", "body": "The app is intended for people aged 14 and over. We do not allow registration or use of the app by anyone under this age, even with the authorisation of a parent or legal guardian. Some features, such as Local Mode, require a higher minimum age (16) which is verified as described in section 10."}]},
    {"title": "16. Changes to This Policy", "cards": [{"type": "", "body": "We may update this policy at any time. We will notify you of relevant changes through the app."}]},
    {"title": "17. Terms of Use & Code of Conduct", "cards": [{"type": "warning", "body": "By registering on <strong>Verdad o Reto</strong> you agree to the following terms of use:", "list": ["<strong>Respectful content:</strong> it is strictly prohibited to post offensive, violent, sexual, discriminatory or hate-inciting content.", "<strong>No harassment:</strong> harassment, intimidation or abusive behaviour towards other users is not tolerated.", "<strong>Real identity:</strong> impersonating other people is not allowed.", "<strong>Legal use:</strong> using the app for illegal activities is strictly prohibited.", "<strong>Consequences:</strong> violation of these rules may result in suspension or permanent deletion of the account without prior notice.", "<strong>Moderation:</strong> the Verdad o Reto team reserves the right to remove any content that violates these rules and to act on reports received within a maximum of 24 hours."], "bodyAfter": "If you find inappropriate content or a user who violates these rules, use the <strong>report</strong> or <strong>block</strong> options available in the app."}, {"type": "warning", "body": "<strong>Fraud & multiple-account prevention</strong><br>To ensure fairness in the ranking and prizes, we reserve the right to suspend or delete accounts created for fraudulent purposes, automated use (bots), result manipulation, or any activity that harms the normal operation of the app.", "list": ["Creating multiple accounts to gain an unfair advantage in the ranking or to repeatedly enter prizes is prohibited.", "If we detect fraud or multiple accounts, we may void participation in the relevant ranking or prize and delete the accounts involved, without prior notice."]}, {"type": "", "body": "<strong>Completing challenges</strong><br>All challenges available in Verdad o Reto are created and reviewed by our team. By accepting and completing any challenge, the user agrees to:", "list": ["Complete it in a safe and responsible manner.", "Not carry out any action that could be illegal, dangerous or that puts their own physical integrity or that of others at risk.", "Not upload videos showing illegal, violent or harmful activities."], "bodyAfter": "Verdad o Reto is not responsible for actions carried out by users beyond the limits of responsible use of the application."}]},

  "sections": [
    {"title": "1. Verantwortlicher", "cards": [{"type": "info", "lines": ["<strong>Name:</strong> Jonatan Ortega González", "<strong>Land:</strong> Spanien", "<strong>E-Mail:</strong> <a href='mailto:devlicius.online@gmail.com'>devlicius.online@gmail.com</a>"]}]},
    {"title": "2. Erfasste Daten", "cards": [{"type": "", "body": "Bei der Registrierung und Nutzung erfassen wir:", "list": ["<strong>Registrierungsdaten:</strong> E-Mail, Nick, Name.", "<strong>Profilbild:</strong> freiwillig hochgeladen.", "<strong>Generierte Inhalte:</strong> Beiträge und Kommentare.", "<strong>Inhalte privater Challenges:</strong> Fotos und Videos, die du mit einem anderen Nutzer über eine private Challenge (Duell) teilst, sichtbar nur für euch beide, sofern ihr euch nicht beide für eine Veröffentlichung im Feed entscheidet.", "<strong>Empfehlungsdaten:</strong> Wenn du einen Einladungscode nutzt oder teilst, speichern wir, welches Konto welches empfohlen hat, um die entsprechende Belohnung zu vergeben.", "<strong>Technische Daten:</strong> Sitzung, Authentifizierungs-Tokens und der Push-Benachrichtigungs-Token des Geräts.", "<strong>Nutzungs- und Analysedaten:</strong> Informationen darüber, wie du die App nutzt, und über die Wirksamkeit unserer Werbekampagnen, in aggregierter Form über <strong>Google Analytics for Firebase</strong> verarbeitet."], "bodyAfter": "Wir erfassen <strong>keine</strong> Standort- oder Bankdaten. Wir erfassen oder speichern auch nicht dein Geburtsdatum, wenn du es für den Lokalen Modus eingibst (siehe Abschnitt 10)."}]},
    {"title": "3. Verarbeitungszweck", "cards": [{"type": "", "body": "Wir verwenden deine Daten ausschließlich für:", "list": ["Konto erstellen und verwalten.", "Teilnahme an Challenges und Wahrheiten, einschließlich privater Challenges (Duelle) zwischen Nutzern.", "Profil anderen Nutzern anzeigen.", "Aktivitätsbenachrichtigungen senden.", "Passwort wiederherstellen.", "Verwaltung des Empfehlungsprogramms und Vergabe der entsprechenden Belohnungen.", "Kontaktaufnahme bei einem Ranking-Gewinn.", "Bewerbung der App durch Zeigen von Nutzerbeiträgen (z. B. in sozialen Netzwerken oder Werbekampagnen), stets unter Wahrung deines Widerspruchsrechts.", "Analyse der App-Nutzung und Messung der Wirksamkeit unserer Werbekampagnen in aggregierter Form."]}]},
    {"title": "4. Rechtsgrundlage", "cards": [{"type": "", "body": "Die Verarbeitung deiner Daten stützt sich je nach Fall auf folgende Rechtsgrundlagen:", "list": ["<strong>Vertragserfüllung:</strong> um dein Konto zu erstellen und dir die Nutzung der App zu ermöglichen.", "<strong>Einwilligung:</strong> für das Profilbild, die werbliche Nutzung deiner Inhalte und ggf. Benachrichtigungen.", "<strong>Berechtigtes Interesse:</strong> zur Analyse der App-Nutzung und zur Messung der Wirksamkeit unserer Werbekampagnen in aggregierter Form, ohne dich individuell über andere Apps oder Websites hinweg zu verfolgen.", "<strong>Erfüllung rechtlicher Verpflichtungen:</strong> soweit dies die geltenden Vorschriften erfordern."]}]},
    {"title": "5. Speicherung & Sicherheit", "cards": [{"type": "", "body": "Deine Daten werden auf sicheren Servern gespeichert. Passwörter sind verschlüsselt. Videos und Bilder werden bei <strong>Cloudinary</strong> gehostet. Wir treffen technische und organisatorische Maßnahmen zum Schutz deiner Daten."}]},
    {"title": "6. Dienstleister & Datenweitergabe", "cards": [{"type": "", "body": "Wir verkaufen oder teilen deine Daten nicht zu kommerziellen Zwecken mit Dritten außerhalb der App. Wir geben Daten nur an Technologiedienstleister weiter, die für den Betrieb der App notwendig sind und deine Daten ausschließlich nach unseren Anweisungen und im Einklang mit geltendem Recht verarbeiten dürfen:", "list": ["<strong>Datenbank:</strong> MongoDB.", "<strong>Nutzerauthentifizierung:</strong> Google Sign-In und Sign in with Apple.", "<strong>Speicherung von Bildern und Videos:</strong> Cloudinary.", "<strong>Push-Benachrichtigungen:</strong> Firebase Cloud Messaging (FCM).", "<strong>Analyse und Werbemessung:</strong> Google Analytics for Firebase (Google).", "<strong>Versand von E-Mails:</strong> Brevo."], "bodyAfter": "Die Analyse und die Messung unserer Werbekampagnen erfolgen in aggregierter Form; wir verwenden keine Kennungen, um dich individuell über verschiedene Apps oder Websites hinweg zu verfolgen. Einige dieser Anbieter können Daten außerhalb des Europäischen Wirtschaftsraums (EWR) verarbeiten. In diesen Fällen stellen wir sicher, dass internationale Übermittlungen im Einklang mit der DSGVO erfolgen, etwa durch EU-Standardvertragsklauseln oder andere geeignete rechtliche Garantien."}]},
    {"title": "7. Datenspeicherung", "cards": [{"type": "", "body": "Wir speichern deine Daten, solange dein Konto aktiv ist. Bei Löschung deines Kontos löschen wir deine personenbezogenen Daten innerhalb von maximal <strong>30 Tagen</strong>, mit Ausnahme der Daten, die wir aus rechtlichen Gründen aufbewahren müssen."}]},
    {"title": "8. Private Challenges (Duelle)", "cards": [{"type": "warning", "body": "Du kannst einen Nutzer, dem du folgst, privat herausfordern. Zu diesem Inhalt:", "list": ["Das Antwort-Foto oder -Video wird auf <strong>Cloudinary</strong> hochgeladen und ist nur für den Nutzer, der die Challenge stellt, und den, der antwortet, sichtbar.", "Der Inhalt wird nur dann im Feed veröffentlicht, wenn <strong>beide Nutzer</strong> ausdrücklich für die Veröffentlichung stimmen. Stimmt einer von beiden dagegen, bleibt der Inhalt privat und geschlossen.", "Wird die Challenge nicht beantwortet, verfällt sie nach <strong>5 Tagen</strong>. Nach Abschluss (abgelehnt, storniert, verfallen oder abgeschlossen) und ohne weitere Aktivität löschen wir den Datensatz und die zugehörigen Medien auf Cloudinary innerhalb von maximal <strong>7 Tagen</strong> endgültig, sofern der Inhalt nicht bereits im öffentlichen Feed veröffentlicht wurde.", "Du kannst eine private Challenge wie jeden anderen Beitrag über das 🚩-Symbol melden. Die Meldung wird von unserem Moderationsteam geprüft."]}]},
    {"title": "9. Empfehlungsprogramm", "cards": [{"type": "", "body": "Wenn du einen Freund mit deinem Einladungscode einlädst oder dich mit dem Code einer anderen Person registrierst, speichern wir auf beiden Konten, welcher Nutzer welchen empfohlen hat, ausschließlich um die entsprechende Belohnung in virtuellen Münzen zu vergeben. Diese Belohnung wird ausgelöst, sobald das eingeladene Konto seine E-Mail bestätigt oder sich mit Google oder Apple anmeldet — als Maßnahme gegen Betrug mit gefälschten Konten."}]},
    {"title": "10. Lokale Altersverifizierung (Lokaler Modus)", "cards": [{"type": "info", "body": "Der <strong>Lokale Modus</strong> (ein lokales Spiel für Personen ab 16 Jahren auf einem gemeinsam genutzten Gerät) fragt nach deinem Geburtsdatum, um das Mindestalter zu überprüfen. Diese Prüfung erfolgt <strong>vollständig auf deinem Gerät</strong>: Wir senden oder speichern dein Geburtsdatum nicht auf unseren Servern. Es wird nur lokal auf deinem Handy gespeichert, dass du diese Prüfung bereits bestanden hast."}]},
    {"title": "11. Links zu sozialen Netzwerken", "cards": [{"type": "", "body": "Die App enthält Links zu unseren externen Profilen auf TikTok, Instagram, Facebook und Patreon. Dies sind ausgehende Links, die die entsprechende App oder den Browser außerhalb von Verdad o Reto öffnen: Wir geben deine Daten beim Antippen nicht an diese Plattformen weiter. Wenn du sie besuchst, gelten die jeweiligen Datenschutzrichtlinien der einzelnen sozialen Netzwerke."}]},
    {"title": "12. Ranking-Preis", "cards": [{"type": "warning", "body": "Nutzer mit den besten Platzierungen im Ranking können einen Preis erhalten. Wenn du gewinnst:", "list": ["Wir kontaktieren dich über die <strong>E-Mail-Adresse, mit der du dich registriert hast</strong>, spätestens <strong>15 Tage</strong> nach Ende des Ranking-Zeitraums.", "Bitte stelle sicher, dass du Zugang zu dieser E-Mail hast, da dies der einzige Kanal ist, über den wir dich benachrichtigen.", "Erhalten wir innerhalb dieser Frist keine Antwort von dir, kann der Preis verfallen oder einem anderen Teilnehmer zugewiesen werden.", "Deine Daten werden im Zusammenhang mit der Preisübergabe nicht an Dritte weitergegeben."]}]},
    {"title": "13. Von Nutzern erstellte Inhalte", "cards": [{"type": "", "body": "Wenn du Inhalte (Fotos, Videos, Kommentare oder Reaktionen) auf Verdad o Reto veröffentlichst, garantierst du, dass du über die erforderlichen Rechte an diesen Inhalten verfügst und dass sie keine Rechte Dritter verletzen.", "bodyAfter": "Außerdem räumst du uns eine nicht-exklusive, unentgeltliche und weltweite Lizenz ein, diese Inhalte innerhalb der App anzuzeigen und zu nutzen, sowie für Werbe- und Promotionzwecke von Verdad o Reto (z. B. in sozialen Netzwerken oder Marketingmaterialien), solange sie veröffentlicht bleiben. Diese Lizenz gilt für Inhalte, die du öffentlich in der App veröffentlichst: Inhalte aus einer privaten Challenge, die nie im Feed veröffentlicht werden, bleiben privat zwischen den beteiligten Nutzern und werden nicht zu Werbezwecken verwendet. Wenn du nicht möchtest, dass deine öffentlichen Inhalte zu Werbezwecken verwendet werden, kannst du uns unter <a href='mailto:devlicius.online@gmail.com'>devlicius.online@gmail.com</a> schreiben."}]},
    {"title": "14. Deine Rechte", "cards": [{"type": "", "body": "Du hast das Recht auf:", "list": ["<strong>Auskunft:</strong> welche Daten wir haben.", "<strong>Berichtigung:</strong> falsche Daten korrigieren.", "<strong>Löschung:</strong> Daten löschen lassen.", "<strong>Übertragbarkeit:</strong> Daten erhalten.", "<strong>Widerspruch:</strong> Verarbeitung widersprechen.", "<strong>Widerruf:</strong> Einwilligung jederzeit widerrufen."], "bodyAfter": "Kontakt: <a href='mailto:devlicius.online@gmail.com'>devlicius.online@gmail.com</a>, um deine Rechte auszuüben. Du kannst auch eine Beschwerde bei der <strong>spanischen Datenschutzbehörde (AEPD)</strong> einreichen, wenn du der Meinung bist, dass deine Rechte nicht beachtet wurden, unter <a href='https://www.aepd.es' target='_blank'>www.aepd.es</a>. Um dein Konto zu löschen, besuche unsere <a href='delete-account.html?lang=de'>Kontolöschungsseite</a>."}]},
    {"title": "15. Minderjährige", "cards": [{"type": "", "body": "Die App richtet sich an Personen ab 14 Jahren. Wir erlauben die Registrierung oder Nutzung der App durch Personen unter diesem Alter nicht, auch nicht mit Zustimmung der Erziehungsberechtigten. Einige Funktionen, wie der Lokale Modus, erfordern ein höheres Mindestalter (16 Jahre), das wie in Abschnitt 10 beschrieben überprüft wird."}]},
    {"title": "16. Änderungen", "cards": [{"type": "", "body": "Wir können diese Richtlinie jederzeit aktualisieren. Wir informieren dich über wesentliche Änderungen innerhalb der App."}]},
    {"title": "17. Nutzungsbedingungen & Verhaltensregeln", "cards": [{"type": "warning", "body": "Mit der Registrierung bei <strong>Verdad o Reto</strong> stimmst du den folgenden Nutzungsbedingungen zu:", "list": ["<strong>Respektvolle Inhalte:</strong> das Posten von beleidigenden, gewalttätigen, sexuellen, diskriminierenden oder hasserregenden Inhalten ist strengstens verboten.", "<strong>Kein Belästigen:</strong> Belästigung, Einschüchterung oder missbräuchliches Verhalten gegenüber anderen Nutzern wird nicht toleriert.", "<strong>Echte Identität:</strong> das Imitieren anderer Personen ist nicht erlaubt.", "<strong>Legale Nutzung:</strong> die Nutzung der App für illegale Aktivitäten ist strengstens verboten.", "<strong>Konsequenzen:</strong> Verstöße gegen diese Regeln können zur Sperrung oder dauerhaften Löschung des Kontos ohne Vorankündigung führen.", "<strong>Moderation:</strong> das Verdad o Reto-Team behält sich das Recht vor, Inhalte zu entfernen und Meldungen innerhalb von maximal 24 Stunden zu bearbeiten."], "bodyAfter": "Wenn du unangemessene Inhalte oder einen Nutzer findest, der gegen diese Regeln verstößt, nutze die in der App verfügbaren Optionen <strong>melden</strong> oder <strong>blockieren</strong>."}, {"type": "warning", "body": "<strong>Betrugs- und Mehrfachkonten-Prävention</strong><br>Um Fairness im Ranking und bei den Preisen zu gewährleisten, behalten wir uns das Recht vor, Konten zu sperren oder zu löschen, die zu betrügerischen Zwecken, durch automatisierte Nutzung (Bots), Manipulation von Ergebnissen oder sonstige Aktivitäten erstellt wurden, die den normalen Betrieb der App beeinträchtigen.", "list": ["Die Erstellung mehrerer Konten, um sich unrechtmäßige Vorteile im Ranking zu verschaffen oder wiederholt an Preisen teilzunehmen, ist untersagt.", "Wenn wir Betrug oder Mehrfachkonten feststellen, können wir die Teilnahme am betreffenden Ranking oder Preis für ungültig erklären und die beteiligten Konten ohne Vorankündigung löschen."]}, {"type": "", "body": "<strong>Herausforderungen durchführen</strong><br>Alle in Verdad o Reto verfügbaren Herausforderungen werden von unserem Team erstellt und überprüft. Durch das Annehmen und Durchführen einer Herausforderung verpflichtet sich der Nutzer:", "list": ["Sie sicher und verantwortungsbewusst durchzuführen.", "Keine Handlungen vorzunehmen, die illegal oder gefährlich sind oder die körperliche Unversehrtheit der eigenen Person oder Dritter gefährden.", "Keine Videos hochzuladen, die illegale, gewalttätige oder schädliche Aktivitäten zeigen."], "bodyAfter": "Verdad o Reto übernimmt keine Verantwortung für Handlungen, die Nutzer außerhalb der Grenzen einer verantwortungsvollen Nutzung der App vornehmen."}]},
    {"title": "18. Haftungsbeschränkung", "cards": [{"type": "", "body": "Die App wird ohne Mängelgewähr (\"as is\") bereitgestellt. Wir garantieren keine unterbrechungsfreie oder fehlerfreie Verfügbarkeit des Dienstes und haften nicht für Unterbrechungen, Datenverluste oder Schäden, die auf Ursachen außerhalb unserer angemessenen Kontrolle zurückzuführen sind."}]}
  ]
},
"zh": {
  "headerSub": "隐私政策与使用条款",
  "title": "隐私政策与使用条款",
  "subtitle": "最后更新：2026年7月",
  "footer": "© 2026 Verdad o Reto · Jonatan Ortega González · 西班牙",
  "contactText": "对隐私有疑问？",
  "intro": "<strong>Verdad o Reto</strong> 非常重视用户隐私。根据《<strong>通用数据保护条例</strong>（GDPR）》及适用的西班牙法律，本政策解释我们收集哪些数据、如何使用以及你享有哪些权利。",
  "sections": [
    {"title": "1. 数据控制者", "cards": [{"type": "info", "lines": ["<strong>姓名：</strong>Jonatan Ortega González", "<strong>国家：</strong>西班牙", "<strong>邮箱：</strong><a href='mailto:devlicius.online@gmail.com'>devlicius.online@gmail.com</a>"]}]},
    {"title": "2. 我们收集的数据", "cards": [{"type": "", "body": "注册和使用应用时，我们收集：", "list": ["<strong>注册数据：</strong>邮箱、昵称、姓名。", "<strong>头像：</strong>自愿上传的图片。", "<strong>生成内容：</strong>帖子、评论和反应。", "<strong>私密挑战内容：</strong>你通过私密挑战（对决）与另一位用户分享的照片和视频，仅在你们两人之间可见，除非你们都选择将其发布到动态中。", "<strong>推荐数据：</strong>如果你使用或分享邀请码，我们会记录哪个账户推荐了哪个账户，以便分配相应的奖励。", "<strong>技术数据：</strong>会话、认证令牌以及设备的推送通知令牌。", "<strong>使用与分析数据：</strong>关于你如何使用应用以及我们广告活动效果的信息，通过 <strong>Google Analytics for Firebase</strong> 以汇总形式处理。"], "bodyAfter": "我们<strong>不收集</strong>位置数据、银行数据或敏感信息。当你为“居家模式”输入出生日期时，我们也不会收集或存储该日期（见第10节）。"}]},
    {"title": "3. 处理目的", "cards": [{"type": "", "body": "我们仅将你的数据用于：", "list": ["创建和管理账户。", "参与挑战和真相，包括用户之间的私密挑战（对决）。", "向其他用户显示你的个人资料。", "发送活动通知。", "找回密码。", "管理推荐计划并分配相应的奖励。", "在你获得排行榜奖励时与你联系。", "在推广应用时展示用户发布的内容（例如在社交媒体或广告活动中），并始终尊重你的反对权。", "以汇总形式分析应用使用情况并衡量我们广告活动的效果。"]}]},
    {"title": "4. 法律依据", "cards": [{"type": "", "body": "根据具体情形，我们对你数据的处理基于以下法律依据：", "list": ["<strong>合同履行：</strong>用于创建你的账户并让你使用本应用。", "<strong>同意：</strong>用于头像、内容的推广使用，以及在适用情况下的通知。", "<strong>正当利益：</strong>以汇总形式分析应用使用情况并衡量我们广告活动的效果，而不会在其他应用或网站上对你进行个人化追踪。", "<strong>履行法律义务：</strong>在适用法律要求时。"]}]},
    {"title": "5. 存储与安全", "cards": [{"type": "", "body": "你的数据存储在安全服务器上。密码加密存储。视频和图片托管在 <strong>Cloudinary</strong>。我们采取技术和组织措施来保护你的信息。"}]},
    {"title": "6. 服务提供商与数据共享", "cards": [{"type": "", "body": "我们不会将你的数据出售或用于商业目的共享给应用之外的第三方。我们仅与应用运营所必需的技术服务提供商共享数据，这些提供商只能按照我们的指示并依据适用法律处理你的数据：", "list": ["<strong>数据库：</strong>MongoDB。", "<strong>用户认证：</strong>Google Sign-In 和 Sign in with Apple。", "<strong>图片和视频存储：</strong>Cloudinary。", "<strong>推送通知：</strong>Firebase Cloud Messaging（FCM）。", "<strong>分析与广告衡量：</strong>Google Analytics for Firebase（Google）。", "<strong>邮件发送：</strong>Brevo。"], "bodyAfter": "分析和广告活动衡量均以汇总形式进行；我们不会使用标识符在不同的应用或网站上对你进行个人化追踪。其中部分服务提供商可能在欧洲经济区（EEA）以外处理数据。在这种情况下，我们会通过标准合同条款或其他适当的法律机制，确保国际数据传输符合GDPR的要求。"}]},
    {"title": "7. 数据保留", "cards": [{"type": "", "body": "我们在账户活跃期间保留你的数据。删除账户后，我们将在最长<strong>30天</strong>内删除你的个人数据，但因法律义务需要保留的数据除外。"}]},
    {"title": "8. 私密挑战（对决）", "cards": [{"type": "warning", "body": "你可以私下向你关注的用户发起挑战。关于这类内容：", "list": ["回应的照片或视频会上传到 <strong>Cloudinary</strong>，仅在发起挑战者和回应者之间可见。", "只有当<strong>双方用户</strong>都明确投票同意发布时，该内容才会在动态中公开。如果任何一方投票不发布，内容将保持私密并关闭。", "如果挑战未被回应，将在<strong>5天</strong>后过期。一旦关闭（被拒绝、取消、过期或已处理）且没有进一步活动，我们会在最长<strong>7天</strong>内永久删除该记录及其在Cloudinary上的媒体内容，除非该内容已发布到公开动态中。", "你可以像举报其他帖子一样，通过 🚩 图标举报私密挑战。举报将由我们的审核团队审查。"]}]},
    {"title": "9. 推荐计划", "cards": [{"type": "", "body": "当你用自己的邀请码邀请朋友，或使用他人的邀请码注册时，我们会在双方账户中记录哪个用户推荐了哪个用户，唯一目的是分配相应的虚拟金币奖励。该奖励会在被邀请账户验证邮箱或使用Google或Apple登录后触发，这是为了防止虚假账户欺诈而采取的措施。"}]},
    {"title": "10. 本地年龄验证（居家模式）", "cards": [{"type": "info", "body": "<strong>居家模式</strong>（供16岁及以上人群在同一设备上进行的本地游戏）会要求你提供出生日期以核实是否满足最低年龄要求。该核实过程<strong>完全在你的设备上进行</strong>：我们不会将你的出生日期发送或存储到我们的服务器。你的手机上仅会本地保存一个“已通过核实”的确认标记。"}]},
    {"title": "11. 社交媒体链接", "cards": [{"type": "", "body": "应用包含指向我们在TikTok、Instagram、Facebook和Patreon上外部资料的链接。这些是外部链接，会在Verdad o Reto之外打开相应的应用或浏览器：点击时我们不会与这些平台共享你的数据。如果你选择访问它们，将适用各社交平台自身的隐私政策。"}]},
    {"title": "12. 排行榜奖励", "cards": [{"type": "warning", "body": "排名靠前的用户可能获得奖励。如果你获奖：", "list": ["我们将在排行榜周期结束后最长<strong>15天</strong>内，通过你<strong>注册时使用的电子邮件地址</strong>与你联系。", "请确保你能访问该邮箱，因为这是我们通知你的唯一渠道。", "如果在该期限内未收到你的回复，奖励可能作废或分配给其他参与者。", "你的数据不会因奖励发放而与第三方共享。"]}]},
    {"title": "13. 用户生成内容", "cards": [{"type": "", "body": "在Verdad o Reto发布内容（照片、视频、评论或反应）时，你保证对该内容拥有必要的权利，且该内容不侵犯第三方权利。", "bodyAfter": "同时，你授予我们一项非独占、免费、全球范围的许可，允许我们在应用内展示和使用该内容，以及将其用于Verdad o Reto的推广和广告目的（例如在社交媒体或营销材料中），期限为该内容保持发布状态期间。此许可仅适用于你在应用中公开发布的内容：从未发布到动态中的私密挑战内容，将在相关用户之间保持私密，不会用于广告目的。如果你不希望你的公开内容用于广告目的，可以通过 <a href='mailto:devlicius.online@gmail.com'>devlicius.online@gmail.com</a> 与我们联系。"}]},

function buildPrivacyCard(card) {
  let h = '<div class="card ' + (card.type||'') + '">';
  if (card.lines) card.lines.forEach(function(l){ h += '<p>' + l + '</p>'; });
  if (card.body) h += '<p>' + card.body + '</p>';
  if (card.list) h += '<ul>' + card.list.map(function(l){ return '<li>'+l+'</li>'; }).join('') + '</ul>';
  if (card.bodyAfter) h += '<p>' + card.bodyAfter + '</p>';
  return h + '</div>';
}

function renderPrivacy(lang) {
  const t = privacyTranslations[lang] || privacyTranslations['es'];
  document.getElementById('header-sub').textContent = t.headerSub;
  document.title = t.headerSub + ' — Verdad o Reto';
  document.getElementById('footer-text').textContent = t.footer;
  let html = '<h1>' + t.title + '</h1><span class="subtitle">' + t.subtitle + '</span><p>' + t.intro + '</p>';
  t.sections.forEach(function(section) {
    html += '<h2>' + section.title + '</h2>';
    section.cards.forEach(function(card) { html += buildPrivacyCard(card); });
  });
  html += '<div class="contact-box"><p>' + t.contactText + '</p><a href="mailto:devlicius.online@gmail.com">devlicius.online@gmail.com</a></div>';
  document.getElementById('content').innerHTML = html;
}
